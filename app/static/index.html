<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="/favicon.png?v=3" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>建物查詢平台</title>
<link rel="stylesheet" href="/common.css?v=1">
<link rel="stylesheet" href="/vendor/maplibre-gl-6.16.0/maplibre-gl.css">
<style>
  html, body { height: 100%; }
  #app { display: grid; grid-template-columns: 396px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: var(--fs-h1); line-height: 28px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; flex: none; }
  .top-nav { display: flex; align-items: center; gap: 5px; flex: none; }
  .nav-pill { display: inline-flex; align-items: center; gap: 3px; padding: 4px 9px; border-radius: 7px;
    background: var(--soft); border: 1px solid var(--line); color: var(--ink); font-size: var(--fs-cap);
    font-weight: 600; text-decoration: none; line-height: 1.4; transition: border-color .15s, color .15s, background .15s; }
  .nav-pill:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .sub { font-size: var(--fs-cap); color: var(--muted); margin-top: 6px; line-height: 1.5; }
  /* 小標（h2、風險資訊的 h4、展開標題）一律 12px 粗體灰字 */
  h2, .risk h4, details summary { font-size: var(--fs-cap); color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  h2 { margin: 0 0 10px; }
  form { display: flex; gap: 6px; }
  input[type=text], input[type=search] { font: inherit; color: var(--ink); background: var(--panel); }
  input[type=text] { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  /* 只套用到左側面板的按鈕；地圖上的縮放按鈕用 MapLibre 自己的樣式 */
  :where(aside) button { font: inherit; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); cursor: pointer; min-block-size: 32px; }
  :where(aside) button:hover { filter: brightness(1.08); }
  :where(aside) button:disabled { opacity: .5; cursor: default; }

  /* ── 分頁：role="tablist"（以底線＋底色共同標示選中，不單靠顏色） ── */
  .tabs { display: flex; padding: 3px; margin-bottom: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius); gap: 2px; }
  .tabs [role="tab"] { position: relative; flex: 1; background: transparent; color: var(--muted); padding: 7px 4px; border-radius: 7px; font-weight: 600; min-block-size: 34px; }
  .tabs [role="tab"][aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .tabs [role="tab"][aria-selected="true"]::after { content: ""; position: absolute; inset: auto 12px 2px; border-block-end: 2.5px solid var(--accent); border-radius: 2px; }

  /* ── 範例快選 ── */
  .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: var(--fs-cap); color: var(--muted); }
  :where(aside) .ex { background: var(--soft); color: var(--ink); border: 1px solid var(--line); padding: 3px 9px; font-size: var(--fs-cap); font-weight: 500; border-radius: 99px; min-block-size: 26px; }
  :where(aside) .ex:hover { border-color: var(--accent); color: var(--accent); filter: none; }

  /* ── 結果卡片與頂部風險快覽 ── */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .bldg-head { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--soft); }
  .bldg-name { font-size: 17px; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; color: var(--ink); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .big { font-size: var(--fs-display); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .big small { font-size: var(--fs-body); font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .subline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: var(--fs-cap); color: var(--muted); }
  .card-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .pill-link, :where(aside) .icon-btn { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); color: var(--ink); border: 1px solid var(--line); padding: 4px 10px; font-size: var(--fs-cap); font-weight: 600; border-radius: 7px; text-decoration: none; min-inline-size: 28px; min-block-size: 28px; line-height: 1.35; transition: border-color .15s, color .15s, background .15s; }
  .pill-link:hover, :where(aside) .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); filter: none; }

  /* 獨立地址列＋地圖／街景膠囊鈕（取代傳統藍色底線超連結） */
  .addr-bar { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
  .addr-txt { font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.45; overflow-wrap: anywhere; }
  .addr-txt small { font-weight: 500; color: var(--muted); }
  .addr-acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .addr-acts .pill-link { background: var(--panel); padding: 3px 9px; min-block-size: 26px; font-size: 12px; }

  /* 複製連結狀態氣泡（用 opacity 顯隱，不移除出無障礙樹） */
  .copy { position: relative; display: inline-flex; align-items: center; }
  .copy-tip { position: absolute; inset-block-start: calc(100% + 5px); inset-inline-end: 0; padding: 3px 8px; border-radius: 6px; background: var(--tip-bg); color: #fff; font-size: 11px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 6; }
  .copy:has([data-copied], [data-failed]) .copy-tip { opacity: 1; }
  .copy-button[data-copied] { border-color: var(--hi); color: var(--hi); }
  .copy-button[data-failed] { border-color: var(--lo); color: var(--lo); }

  /* 信心標籤（顏色＋符號共同標示） */
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-cap); padding: 2px 8px; border-radius: 99px; font-weight: 600; border: 1px solid transparent; }
  .b-高 { background: var(--hi-soft); color: var(--hi); border-color: color-mix(in srgb, var(--hi) 30%, transparent); }
  .b-中 { background: var(--mid-soft); color: var(--mid); border-color: color-mix(in srgb, var(--mid) 30%, transparent); }
  .b-低, .b-無, .b-待確認 { background: var(--lo-soft); color: var(--lo); border-color: color-mix(in srgb, var(--lo) 30%, transparent); }

  /* 頂部風險摘要膠囊 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-cap); font-weight: 600; padding: 3px 9px; border-radius: 99px; text-decoration: none; border: 1px solid transparent; line-height: 1.4; }
  .chip-danger { background: var(--lo-soft); color: var(--lo); border-color: color-mix(in srgb, var(--lo) 28%, transparent); }
  .chip-warn { background: var(--mid-soft); color: var(--mid); border-color: color-mix(in srgb, var(--mid) 30%, transparent); }
  .chip-ok { background: var(--hi-soft); color: var(--hi); border-color: color-mix(in srgb, var(--hi) 28%, transparent); }
  .chip:hover { filter: brightness(.96); }

  /* 欄位：名稱灰、值深色，搭配細分隔線增加掃讀節奏 */
  dl { display: grid; grid-template-columns: 88px 1fr; gap: 0 12px; margin: 12px 0 0; }
  dt, dd { padding: 6px 0; border-bottom: 1px solid var(--soft); }
  dt:last-of-type, dd:last-of-type { border-bottom: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .note { font-size: var(--fs-cap); color: var(--muted); margin-top: 10px; overflow-wrap: anywhere; line-height: 1.6; }
  .note a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .note a:hover { color: var(--accent); }
  .area-bar { margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: var(--soft); border: 1px solid var(--line); font-size: var(--fs-cap); color: var(--ink); text-decoration: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; transition: border-color .15s, background .15s; }
  .area-bar:hover { border-color: var(--accent); background: var(--accent-soft); }
  .area-bar strong { font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .area-bar .area-go { flex: none; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .risk { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; scroll-margin-top: 16px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .risk h3 { font-size: var(--fs-title); font-weight: 700; margin: 0; }
  .risk h4 { margin: 14px 0 0; padding-bottom: 5px; border-bottom: 1px solid var(--soft); }
  .risk dl { margin-top: 4px; }
  .ufl { font-size: var(--fs-cap); color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .rz { color: var(--lo); font-weight: 600; } .rn { color: var(--muted); } .rx { color: var(--muted); }
  .addrs-fold { margin-top: 12px; }
  .addrs { font-size: var(--fs-cap); color: var(--muted); max-height: 150px; overflow-y: auto; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--soft); line-height: 1.75; }

  /* 乾淨的收合條（取代原始瀏覽器超連結感） */
  .fold-card > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 11px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line);
    color: var(--ink); font-size: 12.5px; font-weight: 600; letter-spacing: 0; cursor: pointer; transition: border-color .15s, color .15s; }
  .fold-card > summary::-webkit-details-marker { display: none; }
  .fold-card > summary::after { content: "▾"; color: var(--muted); font-size: 12px; transition: transform .15s; }
  .fold-card[open] > summary::after { transform: rotate(180deg); }
  .fold-card > summary:hover { border-color: var(--accent); color: var(--accent); }

  /* 載入中骨架屏（使用原生 <progress>，不打擾螢幕報讀器） */
  .card.loading { display: flex; flex-direction: column; gap: 10px; }
  .card.loading progress { width: 100%; height: 4px; border: 0; border-radius: 4px; }
  .skel { height: 14px; border-radius: 6px; background: var(--soft); animation: pulse 1.2s ease-in-out infinite; }
  .skel.lg { height: 32px; width: 45%; }
  .skel.short { width: 65%; }
  @keyframes pulse { 50% { opacity: .45; } }

  .tbl-wrap { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-cap); margin-top: 8px; }
  .tbl-wrap table { margin-top: 0; }
  details summary { cursor: pointer; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; background: var(--soft); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.trades tr:not(.tnote) td:first-child { white-space: nowrap; }
  table.trades tr:has(+ .tnote) td { border-bottom: none; padding-bottom: 2px; }
  .tchart { margin: 10px 0 12px; padding: 10px 10px 8px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); }
  .tchart .tsum { font-size: 12.5px; line-height: 1.5; margin-bottom: 4px; }
  .tchart .tplot { margin: 6px 0 2px; }
  .tchart .tcap { margin-top: 6px; }
  table.trades .tnote td { padding-top: 0; padding-bottom: 7px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .more-trades { margin-top: 8px; }
  .more-trades .tbl-wrap { margin-top: 8px; }

  #drop { position: relative; display: block; border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 18px 14px; text-align: center; color: var(--ink); cursor: pointer; line-height: 1.6; background: var(--soft); }
  #drop:hover, #drop.over { border-color: var(--accent); }
  #drop.over { color: var(--accent); }
  #drop .hint { display: block; margin-top: 6px; }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
  #drop:has(#file:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: var(--fs-cap); margin-bottom: 8px; }
  .crumbs button { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; font-size: var(--fs-cap); min-block-size: 28px; }
  .crumbs .cur { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; max-height: 360px; overflow-y: auto; padding: 2px; }
  .tiles.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); }
  .tiles.wide { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .tiles.num { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
  .tile { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 9px 4px; font-weight: 500; line-height: 1.3; position: relative; }
  .tile:hover { border-color: var(--accent); color: var(--accent); filter: none; }
  .tile small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .tile.has::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--hi); }

  #f { position: relative; }
  .qwrap { position: relative; flex: 1; min-width: 0; display: flex; }
  .qwrap input { padding-right: 34px; }
  #qClear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-inline-size: 28px; min-block-size: 28px; width: 28px; height: 28px; padding: 0;
    border-radius: 50%; background: transparent; color: var(--muted); font-size: 18px; font-weight: 400; line-height: 1; }
  #qClear:hover { background: var(--soft); color: var(--ink); filter: none; }
  #sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 12; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; box-shadow: var(--float-shadow); max-height: 320px; overflow-y: auto; }
  .sg { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); border-radius: 0; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .sg:last-child { border-bottom: 0; }
  :where(aside) .sg { font-weight: 400; }
  .sg:hover, .sg.on { background: var(--accent-soft); filter: none; }
  .sg small { display: block; color: var(--muted); margin-top: 2px; }
  .sg .dot { color: var(--hi); }
  .didyou { margin-top: 10px; }
  .didyou .sg { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; }
  #pickFilter { width: 100%; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }

  .meta-sec { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
  .fb { margin-top: 14px; }
  .meta-sec .fb { margin-top: 0; }
  .fbform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: var(--fs-cap); color: var(--muted); }
  .fbform label { display: flex; flex-direction: column; gap: 4px; }
  .fbform .wide { grid-column: 1 / -1; }
  .fbform input, .fbform select, .fbform textarea { font: inherit; font-size: var(--fs-body); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--panel); }
  .fbform textarea { resize: vertical; }
  .fbform button { justify-self: start; }
  .fbbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .card .again.bottom-again { margin-top: 14px; width: 100%; }
  .hint { font-size: var(--fs-cap); color: var(--muted); line-height: 1.6; }

  /* ── 地圖區與浮動控制項（圖層 Popover、2D/3D、縮放提示、樓層圖例、Hover 預覽） ── */
  #mapWrap { position: relative; height: 100%; min-height: 0; background: var(--bg); }
  #map { height: 100%; width: 100%; position: relative; background: var(--bg); }
  .map-tools { position: absolute; top: 12px; left: 12px; z-index: 4; display: flex; gap: 6px; flex-wrap: wrap; }
  .mbtn { font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px; min-block-size: 32px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--float-bg); color: var(--ink); box-shadow: var(--float-shadow); cursor: pointer; backdrop-filter: blur(8px); }
  .mbtn:hover { border-color: var(--accent); color: var(--accent); }
  .mbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .mchip { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-variant-numeric: tabular-nums; }

  #layerBtn { anchor-name: --layer-btn; }
  /* 原生 Popover 圖層面板：@supports 漸進強化 CSS Anchor Positioning，舊瀏覽器安全退回固定位置 */
  #layerPanel { border: 1px solid var(--line); border-radius: 12px; padding: 14px; width: min(300px, calc(100vw - 24px));
    background: var(--panel); color: var(--ink); box-shadow: var(--float-shadow); font-size: var(--fs-body); }
  @supports (position-area: block-end) {
    #layerPanel { position-anchor: --layer-btn; inset: auto; margin: 6px 0 0;
      position-area: block-end span-inline-end; position-try-fallbacks: flip-block, flip-inline, flip-block flip-inline; }
  }
  @supports not (position-area: block-end) {
    #layerPanel { position: fixed; top: 52px; left: 12px; right: auto; bottom: auto; margin: 0; }
  }
  @supports not selector(:popover-open) {
    #layerPanel:not(.open) { display: none; }
    #layerPanel.open { display: block; z-index: 20; }
  }
  .pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .pop-head strong { font-size: 13px; }
  .pop-close { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; min-inline-size: 28px; min-block-size: 28px; border-radius: 6px; cursor: pointer; }
  .pop-close:hover { background: var(--soft); color: var(--ink); }
  .hzl { display: flex; flex-direction: column; gap: 8px; }
  .hz-item { display: flex; flex-direction: column; gap: 4px; }
  .hz-item label { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; }
  .hz-item i { width: 14px; height: 14px; border-radius: 3px; background: var(--c); flex: none; border: 1px solid rgba(0,0,0,.1); }
  .hz-scale { display: flex; gap: 2px; margin-left: 22px; font-size: 11px; color: var(--muted); }
  .hz-scale span { flex: 1; text-align: center; padding-top: 9px; position: relative; font-variant-numeric: tabular-nums; }
  .hz-scale span::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--c); border-radius: 2px; }

  /* 縮放層級浮動提示 */
  #zoomHint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 4;
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; border-radius: 99px;
    background: var(--float-bg); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--float-shadow);
    font-size: var(--fs-cap); backdrop-filter: blur(8px); white-space: nowrap; }
  #zoomHint button { border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
    padding: 3px 10px; border-radius: 99px; cursor: pointer; min-block-size: 24px; }

  /* 左下浮動樓層圖例 */
  #mapLegend { position: absolute; left: 12px; bottom: 12px; z-index: 4; width: min(280px, calc(100% - 76px));
    background: var(--float-bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px 6px;
    box-shadow: var(--float-shadow); backdrop-filter: blur(8px); }
  .leg-title { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .legend { display: flex; gap: 0; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend span { flex: 1; text-align: center; padding-top: 11px; position: relative; }
  .legend span::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--c); }
  .legend span:first-child::before { border-radius: 4px 0 0 4px; } .legend span:last-child::before { border-radius: 0 4px 4px 0; }

  /* 地圖 Hover 輕量建物預覽 */
  #bldgTip { position: absolute; z-index: 5; pointer-events: none; background: var(--tip-bg); color: #fff;
    padding: 5px 9px; border-radius: 7px; font-size: 12px; line-height: 1.4; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); transform: translate(12px, -50%); }
  #bldgTip small { display: block; opacity: .78; font-size: 11px; }

  @media (prefers-color-scheme: dark) {
    .maplibregl-ctrl-group { background: var(--panel); border: 1px solid var(--line); }
    .maplibregl-ctrl-group button + button { border-top-color: var(--line); }
    .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1) brightness(.9); }
    .maplibregl-ctrl-attrib { background: var(--float-bg) !important; color: var(--muted); }
    .maplibregl-ctrl-attrib a { color: var(--accent); }
    .maplibregl-ctrl-attrib-button { filter: invert(1) brightness(.9); }
  }

  .mob-only { display: none; }
  @media (pointer: coarse) {
    .mbtn, :where(aside) .icon-btn, :where(aside) .ex { min-block-size: 36px; }
  }
  @media (max-width: 760px) {
    html, body { height: auto; }
    /* 手機：標題 → 地圖 → 查詢結果 → 分頁與表單 → 其他 */
    #app { display: flex; flex-direction: column; height: auto; }
    aside, aside > section:first-of-type, aside > header { display: contents; }
    aside > * { padding: 0 16px; }
    .brand-row { order: 1; position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 16px 8px; }
    .sub { order: 2; margin-top: 0; padding: 0 16px 10px; }
    #mapWrap { order: 3; height: 45vh; transition: height .2s ease; }
    #mapWrap.compact { height: 24vh; }
    #result { order: 4; padding: 0 16px; margin-top: 12px !important; }
    #result:empty { display: none; }
    .tabs { order: 5; margin: 16px 16px 12px; }
    #typeBox, #pickBox, #batchBox { order: 6; padding: 0 16px; }
    .meta-sec { order: 7; margin: 20px 16px 28px; }
    .crumbs button { padding: 6px 12px; }
    .desk-only { display: none; }
    .mob-only { display: inline-flex !important; }
    .card .again.bottom-again { display: block !important; }
    input[type=text], #pickFilter, .fbform input, .fbform select, .fbform textarea { font-size: 16px; }
    .tiles { max-height: 230px; overflow-y: auto; overscroll-behavior: contain; }
    #zoomHint { top: auto; bottom: 54px; }
    #mapLegend { bottom: 8px; left: 8px; padding: 5px 8px; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; overflow: visible; }
  }
</style>
<!-- Vercel Web Analytics：瀏覽數與訪客數（不用 cookie；本機開發時這支檔案不存在，無作用） -->

<body>
<div id="app">
  <aside aria-label="查詢與建物資訊">
    <header>
      <div class="brand-row">
        <h1 class="brand"><img src="/logo.png" alt="" width="28" height="28">建物查詢平台</h1>
        <nav class="top-nav" aria-label="其他頁面">
          <a id="navStats" class="nav-pill" href="/stats">區域統計</a>
          <a class="nav-pill" href="/about">來源</a>
        </nav>
      </div>
      <div class="sub">查門牌樓層、構造、年份與災害潛勢・非官方工具，結果僅供參考</div>
    </header>

    <section>
      <div class="tabs" role="tablist" aria-label="查詢方式">
        <button type="button" id="tabType" role="tab" aria-selected="true" tabindex="0">輸入地址</button>
        <button type="button" id="tabPick" role="tab" aria-selected="false" tabindex="-1">選擇地址</button>
        <button type="button" id="tabBatch" role="tab" aria-selected="false" tabindex="-1">整批查詢</button>
      </div>

      <div id="typeBox" role="tabpanel" aria-labelledby="tabType">
        <search>
          <form id="f" autocomplete="off">
            <label for="q" class="visually-hidden">地址、建案或地標</label>
            <span class="qwrap">
              <input id="q" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="sugg" placeholder="地址、建案或地標，例：市政路390號">
              <button type="button" id="qClear" aria-label="清除輸入" title="清除" hidden>×</button>
            </span>
            <button type="submit" id="qBtn">查詢</button>
            <div id="sugg" role="listbox" aria-label="建議門牌" hidden></div>
          </form>
        </search>
        <div class="examples" aria-label="範例查詢">
          <span>試查：</span>
          <button type="button" class="ex" data-q="臺中市西屯區市政路390號">市政路390號</button>
          <button type="button" class="ex" data-q="台北101">台北101</button>
          <button type="button" class="ex" data-q="台北之星">台北之星</button>
        </div>
        <div class="hint" style="margin-top:4px">支援錯字、簡寫、地標或建案名稱</div>
      </div>

      <div id="pickBox" role="tabpanel" aria-labelledby="tabPick" hidden>
        <div class="crumbs" id="crumbs"></div>
        <input id="pickFilter" type="search" aria-label="篩選選項" placeholder="篩選（可不填）" hidden>
        <div class="tiles" id="tiles"></div>
        <div class="hint" id="pickHint" style="margin-top:6px"></div>
      </div>

      <div id="batchBox" role="tabpanel" aria-labelledby="tabBatch" hidden>
        <label id="drop">
          <b class="desk-only">拖曳 Excel / CSV 到這裡</b><span class="desk-only">，或點擊選檔</span><b class="mob-only">點擊選擇 Excel / CSV 檔</b>
          <span class="hint">自動找「地址」欄，回傳加上樓層欄位的 Excel<br>一次最多 2,000 筆、4 MB</span>
          <input id="file" type="file" accept=".xlsx,.xls,.csv" aria-label="選擇要整批查詢的 Excel 或 CSV 檔">
        </label>
        <div id="batchMsg" class="note" aria-live="polite"></div>
      </div>

      <div id="srStatus" class="visually-hidden" aria-live="polite"></div>
      <div id="result" style="margin-top:12px"></div>
    </section>

    <section class="meta-sec">
      <details class="fb fb-general fold-card"><summary>回報問題</summary>
        <form class="fbform">
          <label class="wide">問題類型<select name="kind"></select></label>
          <label class="wide">地點<input name="address" maxlength="100" placeholder="可不填，例：信義計畫區、某條路一帶"></label>
          <label class="wide">說明<textarea name="detail" maxlength="500" rows="3" required placeholder="例：這一區的建物都畫錯了、手機版某個按鈕沒反應"></textarea></label>
          <label class="wide">聯絡方式<input name="contact" maxlength="100" placeholder="可不填（需要確認時聯絡你）"></label>
          <button type="submit">送出</button><span class="fbmsg hint" aria-live="polite"></span>
          <div class="hint wide">樓層錯誤請先查詢該地址或點選建物，從結果卡片下方回報。</div>
        </form>
      </details>

      <details class="fold-card"><summary>各縣市涵蓋率</summary><div class="tbl-wrap"><table id="stats"></table></div></details>
    </section>
  </aside>

  <main id="mapWrap" aria-label="3D 建物地圖">
    <div id="map"></div>
    <div class="map-tools" id="mapTools">
      <button type="button" id="layerBtn" class="mbtn" popovertarget="layerPanel">圖層<span id="hzBadge" class="mchip" hidden></span></button>
      <button type="button" id="tiltBtn" class="mbtn" aria-pressed="true" aria-label="切換 2D 俯視與 3D 立體">3D</button>
      <button type="button" id="mapSizeBtn" class="mbtn mob-only" aria-pressed="false">縮小地圖</button>
    </div>
    <div id="layerPanel" popover="auto">
      <div class="pop-head">
        <strong>災害潛勢圖層</strong>
        <button type="button" class="pop-close" id="layerClose" popovertarget="layerPanel" popovertargetaction="hide" aria-label="關閉圖層面板">×</button>
      </div>
      <div class="hzl" id="hzl"></div>
      <div class="hint" id="hzhint" style="margin-top:8px">勾選後疊在地圖上；放大到鄉鎮範圍才會顯示。潛勢圖僅供防災參考。</div>
    </div>
    <div id="zoomHint" hidden><span>放大至街區顯示 3D 建物</span><button type="button" id="zoomInBtn">放大</button></div>
    <div id="mapLegend"><span class="leg-title">地上樓層（點建物看屬性）</span><div class="legend" id="legend"></div></div>
    <div id="bldgTip" aria-hidden="true" hidden></div>
  </main>
</div>

<script type="module">
// MapLibre 6（ES module）：4.x 在 Safari 27 會不斷 WebGL context lost，6.12+ 修了 GPU 程序掛掉的處理
// 動態載入（檔案在 app/static/vendor/）：載入失敗時只有地圖顯示說明，查詢照常
let maplibregl;
try { maplibregl = await import("/vendor/maplibre-gl-6.16.0/maplibre-gl.mjs"); }
catch (e) { console.error("MapLibre 載入失敗", e); }

const RAMP = [[1, "#dbe7f3"], [3, "#9ec2e6"], [6, "#5b93d1"], [13, "#2f64b5"], [21, "#7c3aed"], [31, "#db2777"]];
const LABELS = ["1–2", "3–5", "6–12", "13–20", "21–30", "31+"];
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function renderLegend(dark) {
  document.getElementById("legend").innerHTML =
    RAMP.map((r, i) => `<span style="--c:${r[1]}">${LABELS[i]}</span>`).join("")
    + `<span style="--c:${dark ? "#64748b" : "#cbd5e1"}">未知</span>`;
}
renderLegend(darkMQ.matches);

function webglOK() {
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
  catch { return false; }
}
const MAP_OK = typeof maplibregl !== "undefined" && webglOK();
const NOOP = new Proxy(function () {}, { get: (t, k) => k === Symbol.toPrimitive ? () => "" : NOOP, apply: () => NOOP });
if (!MAP_OK) {
  document.getElementById("mapTools").hidden = true;
  document.getElementById("mapLegend").hidden = true;
  document.getElementById("map").innerHTML = `<div style="padding:24px;max-width:460px;color:var(--muted);font-size:14px;line-height:1.7">
    <b style="color:var(--ink)">這個瀏覽器無法顯示 3D 地圖</b><br>
    地圖需要 WebGL。請確認瀏覽器設定裡的「硬體加速」已開啟，或改用最新版 Chrome、Edge、Safari。<br>
    查詢功能不受影響，可以照常使用。</div>`;
}

// ── 災害潛勢圖層（/api/hazards）：顏色依等級（rank）由淺到深，附多階色階說明 ──
const HAZARDS = [
  { kind: "flood500", name: "淹水（24h 500mm）", colors: ["#c6dbef", "#9ecae1", "#6baed6", "#3182bd", "#08519c"], labels: ["0.3–0.5", "0.5–1", "1–2", "2–3", ">3m"] },
  { kind: "liquefaction", name: "土壤液化", colors: ["#fee391", "#fe9929", "#cc4c02"], labels: ["低潛勢", "中潛勢", "高潛勢"] },
  { kind: "fault", name: "活動斷層", colors: ["#d7301f"] },
  { kind: "landslide", name: "山崩地滑", colors: ["#8c510a"] },
  { kind: "debris", name: "土石流", colors: ["#bcbddc", "#807dba", "#54278f"], labels: ["低風險", "中風險", "高風險"] },
  { kind: "fire_station", name: "消防分隊", colors: ["#e31a1c"], point: true },
];
const HZ_MIN_ZOOM = 12;
const rankColor = cs => cs.length === 1 ? cs[0] : ["match", ["get", "rank"], ...cs.flatMap((c, i) => [i, c]), cs[0]];
const HAZARD_LAYERS = HAZARDS.flatMap(h => h.point
  ? [{ id: `hz-${h.kind}`, type: "circle", source: `hz-${h.kind}`, layout: { visibility: "none" },
       paint: { "circle-radius": 6, "circle-color": h.colors[0], "circle-stroke-color": "#fff", "circle-stroke-width": 2 } }]
  : [{ id: `hz-${h.kind}`, type: "fill", source: `hz-${h.kind}`, layout: { visibility: "none" },
       paint: { "fill-color": rankColor(h.colors), "fill-opacity": 0.42 } },
     { id: `hz-${h.kind}-line`, type: "line", source: `hz-${h.kind}`, layout: { visibility: "none" },
       paint: { "line-color": rankColor(h.colors), "line-width": 1, "line-opacity": 0.72 } }]);

// ── 3D 建物光影、天空霧化與淺／深色模式地圖配色 ──
const SEL_COLOR = "#ff8f00";
const HOVER_COLOR = "#38bdf8";
const NONE_FILTER = ["==", ["get", "uid"], ""];
const GROUND_FILTER = ["==", ["coalesce", ["get", "base"], 0], 0];
let selectedUid = "";
let hoverTarget = null; // { prop: "uid" | "addr", val: string }

function mapTheme(dark) {
  return dark ? {
    light: { anchor: "map", color: "#dbeafe", intensity: 0.52, position: [1.35, 210, 48] },
    sky: { "sky-color": "#0b1324", "sky-horizon-blend": 0.65, "horizon-color": "#1a2942",
           "horizon-fog-blend": 0.6, "fog-color": "#152236", "fog-ground-blend": 0.72 },
    emap: { "raster-brightness-min": 0.02, "raster-brightness-max": 0.54, "raster-saturation": -0.52, "raster-contrast": 0.24 },
    unk: "#64748b", base: "rgba(2, 6, 23, 0.36)", edge: "rgba(226, 232, 240, 0.24)",
  } : {
    light: { anchor: "map", color: "#fff7ec", intensity: 0.46, position: [1.35, 205, 42] },
    sky: { "sky-color": "#c5dcf5", "sky-horizon-blend": 0.65, "horizon-color": "#eef4fb",
           "horizon-fog-blend": 0.55, "fog-color": "#eef4fb", "fog-ground-blend": 0.72 },
    emap: { "raster-brightness-min": 0, "raster-brightness-max": 0.96, "raster-saturation": -0.18, "raster-contrast": 0.04 },
    unk: "#cbd5e1", base: "rgba(15, 23, 42, 0.14)", edge: "rgba(15, 23, 42, 0.24)",
  };
}
// 沒有樓層、只有 OSM 高度的建物：以 高度÷3.2m 上色；選中橘色、滑過亮青藍
function bldgColorExpr(dark) {
  const baseExpr = ["case", ["all", ["==", ["get", "floors"], null], ["==", ["get", "h"], null]], mapTheme(dark).unk,
    ["step", ["coalesce", ["get", "floors"], ["/", ["get", "h"], 3.2]], RAMP[0][1], ...RAMP.slice(1).flat()]];
  const branches = [];
  if (selectedUid) branches.push(["==", ["get", "uid"], selectedUid], SEL_COLOR);
  if (hoverTarget && !(hoverTarget.prop === "uid" && hoverTarget.val === selectedUid)) {
    branches.push(["==", ["get", hoverTarget.prop], hoverTarget.val], HOVER_COLOR);
  }
  return branches.length ? ["case", ...branches, baseExpr] : baseExpr;
}

const initParams = new URLSearchParams(location.search);
const initQ = initParams.get("q")?.trim();
const initBldg = initParams.get("bldg")?.trim();
let savedView = null;
try {
  const fromSub = document.referrer && new URL(document.referrer).origin === location.origin
    && /^\/(stats|about)\b/.test(new URL(document.referrer).pathname);
  if (initQ || initBldg || fromSub) {
    const raw = JSON.parse(sessionStorage.getItem("lastMapView") || "null");
    if (raw && Array.isArray(raw.center) && Number.isFinite(raw.zoom)) savedView = raw;
  }
} catch {}

const initTheme = mapTheme(darkMQ.matches);
const map = !MAP_OK ? NOOP : new maplibregl.Map({
  container: "map",
  maxPitch: 70,
  style: {
    version: 8,
    light: initTheme.light,
    sky: initTheme.sky,
    sources: {
      emap: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}"],
        attribution: "© 內政部國土測繪中心" },
      bldg: { type: "geojson", data: { type: "FeatureCollection", features: [] },
        attribution: "建物外框：<a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">© OpenStreetMap 貢獻者</a>、臺中市政府、臺北市政府｜樓層與門牌：內政部實價登錄、各縣市政府門牌與使用執照資料（<a href=\"/about\">完整來源</a>）" },
      pin: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      ...Object.fromEntries(HAZARDS.map(h => [`hz-${h.kind}`, { type: "geojson", data: { type: "FeatureCollection", features: [] },
        attribution: "災害潛勢：經濟部水利署、地質調查及礦業管理中心、農業部、臺南市政府、內政部消防署" }])),
    },
    layers: [
      { id: "emap", type: "raster", source: "emap", paint: initTheme.emap },
      ...HAZARD_LAYERS,
      { id: "bldg-base", type: "fill", source: "bldg", minzoom: 15.2, filter: GROUND_FILTER, paint: {
          "fill-color": initTheme.base,
          "fill-opacity": ["interpolate", ["linear"], ["zoom"], 15.2, 0, 16, 1] } },
      { id: "bldg-edge", type: "line", source: "bldg", minzoom: 15.6, filter: GROUND_FILTER, paint: {
          "line-color": initTheme.edge,
          "line-width": ["interpolate", ["linear"], ["zoom"], 15.6, 0.5, 18, 1.3],
          "line-opacity": ["interpolate", ["linear"], ["zoom"], 15.6, 0, 16.5, 1] } },
      { id: "bldg-hover", type: "line", source: "bldg", filter: NONE_FILTER, paint: {
          "line-color": HOVER_COLOR, "line-width": 4, "line-blur": 2, "line-opacity": 0.9 } },
      { id: "bldg-sel-glow", type: "line", source: "bldg", filter: NONE_FILTER, paint: {
          "line-color": SEL_COLOR, "line-width": 11, "line-blur": 6, "line-opacity": 0.48 } },
      { id: "bldg-sel", type: "line", source: "bldg", filter: NONE_FILTER,
        paint: { "line-color": "#ff6d00", "line-width": 2.5 } },
      { id: "bldg", type: "fill-extrusion", source: "bldg", paint: {
          "fill-extrusion-color": bldgColorExpr(darkMQ.matches),
          "fill-extrusion-height": ["coalesce", ["get", "h"], 3.2],
          "fill-extrusion-base": ["coalesce", ["get", "base"], 0],
          "fill-extrusion-vertical-gradient": true,
          "fill-extrusion-opacity": ["interpolate", ["linear"], ["zoom"], 15.2, 0, 15.6, 0.9, 17, 0.95],
          "fill-extrusion-color-transition": { duration: 180 },
          "fill-extrusion-opacity-transition": { duration: 260 } } },
      { id: "pin", type: "circle", source: "pin",
        paint: { "circle-radius": 7, "circle-color": "#ff6d00", "circle-stroke-color": "#fff", "circle-stroke-width": 2.5 } },
    ],
  },
  center: savedView?.center || [121.5654, 25.0355],
  zoom: savedView?.zoom ?? 16,
  pitch: savedView?.pitch ?? 50,
  bearing: savedView?.bearing ?? -15,
  attributionControl: { compact: true },
  locale: { "GeolocateControl.FindMyLocation": "移到我的位置", "GeolocateControl.LocationNotAvailable": "無法取得位置" },
});
function applyBldgColors() {
  if (!MAP_OK || !mapReady) return;
  map.setPaintProperty("bldg", "fill-extrusion-color", bldgColorExpr(darkMQ.matches));
}
function applyMapTheme(dark) {
  renderLegend(dark);
  if (!MAP_OK || !mapReady) return;
  const t = mapTheme(dark);
  if (typeof map.setLight === "function") map.setLight(t.light);
  if (typeof map.setSky === "function") map.setSky(t.sky);
  for (const [k, val] of Object.entries(t.emap)) map.setPaintProperty("emap", k, val);
  map.setPaintProperty("bldg-base", "fill-color", t.base);
  map.setPaintProperty("bldg-edge", "line-color", t.edge);
  applyBldgColors();
}
darkMQ.addEventListener?.("change", e => applyMapTheme(e.matches));
if (MAP_OK) {
  map.addControl(new maplibregl.NavigationControl());
  const geo = new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true, timeout: 10000 },
                                                showAccuracyCircle: true });
  map.addControl(geo);
  geo.on("geolocate", () => navigator.sendBeacon?.("/api/event", "geolocate"));
  geo.on("geolocate", e => map.easeTo({ center: [e.coords.longitude, e.coords.latitude], zoom: 17 }));
  const geoBtn = map.getContainer().querySelector(".maplibregl-ctrl-geolocate");
  if (geoBtn) new MutationObserver(() => { if (geoBtn.disabled) geoBtn.disabled = false; })
    .observe(geoBtn, { attributes: true, attributeFilter: ["disabled"] });
  geo.on("error", e => {
    const why = e.code === 1 ? "瀏覽器沒有允許本站使用位置資訊，可在網址列左側的設定開啟" : "暫時無法取得位置，請稍後再試";
    document.getElementById("result").innerHTML = `<div class="note">${why}。</div>`;
  });
}
window.map = map;

// ── Popover 舊瀏覽器安全退回（原生支援 Popover API 時不做任何事） ──
const layerBtn = document.getElementById("layerBtn"), layerPanel = document.getElementById("layerPanel");
if (!Object.hasOwn(HTMLElement.prototype, "popover")) {

// 地圖範圍往外取整到 0.005 度（約 500 公尺）：附近的畫面送出相同的請求，可以直接用 CDN 快取的結果
const snapBox = b => [Math.floor(b.getWest() / .005) * .005, Math.floor(b.getSouth() / .005) * .005,
  Math.ceil(b.getEast() / .005) * .005, Math.ceil(b.getNorth() / .005) * .005].map(v => v.toFixed(3)).join(",");
const EMPTY_FC = { type: "FeatureCollection", features: [] };
let mapReady = false;
map.on("load", () => { mapReady = true; syncZoomHint(); });
let timer, bldgSeq = 0, bldgBox = "";
async function loadBuildings() {
  if (!MAP_OK || !mapReady) return;
  syncZoomHint();
  const seq = ++bldgSeq;
  if (map.getZoom() < 15.5) { if (bldgBox) { map.getSource("bldg").setData(EMPTY_FC); bldgBox = ""; } return; }
  const box = snapBox(map.getBounds());
  if (box === bldgBox) return;
  try {
    const r = await fetch(`/api/buildings?bbox=${box}`);
    if (!r.ok) return;
    const data = await r.json();
    if (seq !== bldgSeq) return;
    map.getSource("bldg").setData(data);
    bldgBox = box;
  } catch (e) { console.error("建物載入失敗", e); }
}
function saveMapView() {
  if (!MAP_OK) return;
  try {
    const c = map.getCenter();
    sessionStorage.setItem("lastMapView", JSON.stringify({
      center: [c.lng, c.lat], zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing(),
    }));
  } catch {}
}
map.on("moveend", () => { saveMapView(); syncZoomHint(); clearTimeout(timer); timer = setTimeout(loadBuildings, 200); });
window.addEventListener("pagehide", saveMapView);
map.on("load", loadBuildings);

// ── 災害潛勢圖層：勾選的才載入，記住勾選狀態，並在浮動鈕顯示啟用數量與各階色帶 ──
let hzOn = new Set();
try { hzOn = new Set(JSON.parse(localStorage.getItem("hazards") || "[]")); } catch {}
const hzEl = document.getElementById("hzl"), hzHint = document.getElementById("hzhint"), hzBadge = document.getElementById("hzBadge");
function syncHzBadge() {
  hzBadge.textContent = hzOn.size ? String(hzOn.size) : "";
  hzBadge.hidden = !hzOn.size;
  layerBtn.setAttribute("aria-label", hzOn.size ? `災害潛勢圖層（已開啟 ${hzOn.size} 項）` : "開啟災害潛勢圖層");
  hzEl.querySelectorAll(".hz-scale").forEach(el => { el.hidden = !hzOn.has(el.dataset.kind); });
}
hzEl.innerHTML = HAZARDS.map(h => {
  const scale = h.labels ? `<div class="hz-scale" data-kind="${h.kind}" ${hzOn.has(h.kind) ? "" : "hidden"}>${
    h.colors.map((c, i) => `<span style="--c:${c}">${h.labels[i]}</span>`).join("")}</div>` : "";
  return `<div class="hz-item"><label><input type="checkbox" value="${h.kind}" ${hzOn.has(h.kind) ? "checked" : ""}>
    <i style="--c:${h.colors[h.colors.length - 1]}"></i>${h.name}</label>${scale}</div>`;
}).join("");
syncHzBadge();
hzEl.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  e.target.checked ? hzOn.add(e.target.value) : hzOn.delete(e.target.value);
  try { localStorage.setItem("hazards", JSON.stringify([...hzOn])); } catch {}
  syncHzBadge();
  loadHazards();
});
let hzTimer, hzSeq = 0;
const hzDrawn = {};
async function loadHazards() {
  if (!MAP_OK || !mapReady) return;
  const seq = ++hzSeq, z = map.getZoom(), bbox = snapBox(map.getBounds());
  const jobs = HAZARDS.map(async h => {
    const on = hzOn.has(h.kind);
    for (const id of [`hz-${h.kind}`, `hz-${h.kind}-line`]) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
    if (!on) return false;
    if (z < HZ_MIN_ZOOM) {
      if (hzDrawn[h.kind]) { map.getSource(`hz-${h.kind}`).setData(EMPTY_FC); delete hzDrawn[h.kind]; }
      return true;
    }
    if (hzDrawn[h.kind]?.box === bbox) return hzDrawn[h.kind].tooLarge;
    const r = await fetch(`/api/hazards?kind=${h.kind}&bbox=${bbox}`);
    if (!r.ok) throw new Error(`${h.kind} ${r.status}`);
    const data = await r.json();
    if (seq !== hzSeq) return false;
    map.getSource(`hz-${h.kind}`).setData(data);
    hzDrawn[h.kind] = { box: bbox, tooLarge: !!data.too_large };
    return !!data.too_large;
  });
  const res = await Promise.allSettled(jobs);
  if (seq !== hzSeq) return;
  for (const x of res) if (x.status === "rejected") console.error("災害圖層載入失敗", x.reason);
  const tooFar = res.some(x => x.status === "fulfilled" && x.value);
  hzHint.textContent = tooFar ? "目前地圖範圍太大，放大到鄉鎮範圍才會顯示圖層。"
    : "勾選後疊在地圖上；放大到鄉鎮範圍才會顯示。潛勢圖僅供防災參考。";
}
map.on("moveend", () => { clearTimeout(hzTimer); hzTimer = setTimeout(loadHazards, 250); });
map.on("load", loadHazards);
map.on("load", () => document.querySelectorAll(".maplibregl-ctrl-attrib.maplibregl-compact-show")
  .forEach(e => e.classList.remove("maplibregl-compact-show")));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const v = x => x == null || x === "" ? "—" : esc(x);
const srStatus = document.getElementById("srStatus");
let lastSr = "";
function announce(text) {
  let msg = text;
  if (msg === lastSr) msg += "\u00A0";
  lastSr = msg;
  srStatus.textContent = "";
  requestAnimationFrame(() => { srStatus.textContent = msg; });
}

const navStats = document.getElementById("navStats");
function syncPageUrl(params, title, county, town) {
  const q = new URLSearchParams();
  for (const [k, val] of Object.entries(params)) if (val) q.set(k, val);
  const qs = q.toString();
  const nextUrl = `${location.pathname}${qs ? `?${qs}` : ""}`;
  history.replaceState(null, "", nextUrl);
  try { sessionStorage.setItem("lastQueryUrl", nextUrl); } catch {}
  document.title = title ? `${title} — 建物查詢平台` : "建物查詢平台";
  if (county) {

    if (town) sq.set("town", town);
    navStats.href = `/stats?${sq}`;
  } else {
    navStats.href = "/stats";
  }
}

// ── 複製分享連結（Invoker Commands + 舊瀏覽器 click 退回 + Async Clipboard / execCommand 退回） ──
function legacyCopy(text) {
  const prev = document.activeElement;
  const f = Object.assign(document.createElement("textarea"), { value: text });
  f.setAttribute("readonly", "");
  f.style.cssText = "position:fixed;inset-block-start:0;opacity:0";
  document.body.append(f);
  f.select();
  try { return document.execCommand("copy"); }
  finally { f.remove(); prev?.focus({ preventScroll: true }); }
}
const copyTimers = new WeakMap();
let lastCopyMsg = "";
function reportCopy(button, ok) {
  const tip = button.nextElementSibling;
  clearTimeout(copyTimers.get(button));
  button.removeAttribute("data-copied");
  button.removeAttribute("data-failed");
  let message = ok ? "已複製連結" : "複製失敗";
  if (message === lastCopyMsg) message += "\u00A0";
  lastCopyMsg = message;
  tip.textContent = "";
  void button.offsetWidth;
  button.setAttribute(ok ? "data-copied" : "data-failed", "");
  requestAnimationFrame(() => { tip.textContent = message; });
  copyTimers.set(button, setTimeout(() => {
    button.removeAttribute("data-copied");
    button.removeAttribute("data-failed");
    tip.textContent = "";
  }, 2000));
}
async function doCopy(button, target) {
  const text = target.matches("input, textarea") ? target.value : target.textContent.trim();
  if (!text) return;
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else if (!legacyCopy(text)) throw new Error("fail");
    reportCopy(button, true);
  } catch {
    if (legacyCopy(text)) reportCopy(button, true);
    else reportCopy(button, false);
  }
}
if ("CommandEvent" in window) {
  document.addEventListener("command", e => {
    if (e.command === "--copy") doCopy(e.source, e.target);
  }, true);
} else {
  document.addEventListener("click", e => {
    if (e.defaultPrevented) return;
    const btn = e.target.closest('button[command="--copy"]');
    if (!btn) return;
    const target = document.getElementById(btn.getAttribute("commandfor"));
    if (target) doCopy(btn, target);
  });
}

function viewOf(door, bldg) {
  const view = { center: [door.lon, door.lat], zoom: 18, pitch: 55 };
  if (!bldg || bldg.lon == null) return view;
  const k = Math.cos(door.lat * Math.PI / 180);
  const dx = (bldg.lon - door.lon) * k, dy = bldg.lat - door.lat;
  view.center = [bldg.lon, bldg.lat];
  if (Math.hypot(dx, dy) > 3e-5) view.bearing = Math.atan2(dx, dy) * 180 / Math.PI;
  return view;
}

function setPin(r) {
  if (!mapReady) { map.once("load", () => setPin(r)); return; }
  map.getSource("pin")?.setData(r ? { type: "Point", coordinates: [r.lon, r.lat] } : EMPTY_FC);
}
function select(uid) {
  selectedUid = uid || "";
  if (!mapReady) { map.once("load", () => select(selectedUid)); return; }
  const flt = selectedUid ? ["all", ["==", ["get", "uid"], selectedUid], GROUND_FILTER] : NONE_FILTER;
  map.setFilter("bldg-sel", flt);
  map.setFilter("bldg-sel-glow", flt);
  applyBldgColors();
}

// ── 區域統計快取（走勢圖與「本區概況」共用，同區不重複抓） ──
const dashCache = new Map();
async function getDashboard(county, town) {
  if (!county) return null;
  const key = `${county}|${town || ""}`;
  if (dashCache.has(key)) return dashCache.get(key);
  const p = new URLSearchParams({ county });
  if (town) p.set("town", town);
  const prom = fetch(`/api/dashboard?${p}`).then(r => r.ok ? r.json() : null).catch(() => null);
  dashCache.set(key, prom);
  const d = await prom;
  if (!d) dashCache.delete(key);
  return d;
}

// ── 頂部風險摘要膠囊（Above the fold 一眼掌握災害命中情形） ──
const NOT_IN_ZONE = "未在範圍內", NO_MAP = "此區無圖資";
const isHit = x => x && x !== NOT_IN_ZONE && x !== NO_MAP;
function riskChipsHtml(r) {
  const chips = [];
  if (isHit(r.flood500)) {
    const sev = r.flood500 === "0.3-0.5" ? "chip-warn" : "chip-danger";
    chips.push(`<a class="chip ${sev}" href="#risk-detail">淹水 ${esc(r.flood500)}m</a>`);
  } else if (isHit(r.flood650)) {
    chips.push(`<a class="chip chip-warn" href="#risk-detail">650mm 淹水 ${esc(r.flood650)}m</a>`);
  }
  if (isHit(r.liquefaction)) {
    const sev = r.liquefaction.includes("高") ? "chip-danger" : "chip-warn";
    chips.push(`<a class="chip ${sev}" href="#risk-detail">液化 ${esc(r.liquefaction)}</a>`);
  }
  if (isHit(r.fault)) chips.push(`<a class="chip chip-danger" href="#risk-detail">活動斷層</a>`);
  if (isHit(r.landslide)) chips.push(`<a class="chip chip-danger" href="#risk-detail">山崩地滑</a>`);
  if (isHit(r.debris)) chips.push(`<a class="chip chip-danger" href="#risk-detail">土石流</a>`);
  if (!chips.length) {
    const checked = [r.flood500, r.flood650, r.liquefaction, r.fault, r.landslide, r.debris].some(x => x === NOT_IN_ZONE);
    if (checked) chips.push(`<a class="chip chip-ok" href="#risk-detail">✓ 無已知災害潛勢</a>`);
  }
  return chips.length ? `<div class="chips" aria-label="災害潛勢快覽">${chips.join("")}</div>` : "";
}

const CONF_ICON = { "高": "✓", "中": "~", "低": "!", "待確認": "?", "無": "—" };
function confBadge(conf) {
  if (!conf) return "";
  return `<span class="badge b-${esc(conf)}"><span aria-hidden="true">${CONF_ICON[conf] || ""}</span> 信心：${esc(conf)}</span>`;
}

function addrBarHtml(text, extraNote, queryForMap, lat, lon) {
  if (!text && lat == null) return "";
  const mapUrl = queryForMap
    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryForMap)}`
    : `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  const acts = [`<a class="pill-link" href="${esc(mapUrl)}" target="_blank" rel="noopener">Google 地圖 ↗</a>`];
  if (lat != null && lon != null) {
    acts.push(`<a class="pill-link" href="${esc(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`)}" target="_blank" rel="noopener">街景 ↗</a>`);
  }
  return `<div class="addr-bar">
    <div class="addr-txt">${text ? esc(text) : "無門牌（依建物位置）"}${extraNote ? ` <small>${extraNote}</small>` : ""}</div>
    <div class="addr-acts">${acts.join("")}</div>
  </div>`;
}

// ── 整合後的主結果卡片（突出建物／建案名稱、卡片式地址與按鈕、消除原始超連結感） ──

  const belowTxt = r.floors_below != null ? `地下 ${esc(r.floors_below)} 層` : "";

  const bldgName = r.name || bldg?.name || "";

  let unitRow = "";

    const more = (r.addresses || []).length > 1 ? `（共 ${r.n_units || r.addresses.length} 個門牌）` : "";
    const full = first ? `${r.county || ""}${first}` : "";

      ? (r.county && !r.normalized.startsWith(r.county) ? `${r.county}${r.town || ""}${r.normalized}` : r.normalized)
      : "";

  const areaLink = r.county
    ? `/stats?county=${encodeURIComponent(r.county)}${r.town ? `&town=${encodeURIComponent(r.town)}` : ""}`
    : "";
  const areaLabel = r.town || r.county || "";

  return `<div class="card">
    ${bldgName ? `<div class="bldg-head"><div class="bldg-name">${esc(bldgName)}</div></div>` : ""}
    <div class="card-top">
      <div>
        <div class="big">${v(r.floors_above)}<small>層（地上）</small></div>
        <div class="subline">
          ${belowTxt ? `<span>${belowTxt}</span>` : ""}
          ${confBadge(r.confidence)}
        </div>
      </div>
      <div class="card-actions">
        <span id="shareUrl" class="visually-hidden">${esc(shareUrl)}</span>
        <span class="copy">
          <button type="button" class="icon-btn copy-button" command="--copy" commandfor="shareUrl">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            複製連結
          </button>
          <span class="copy-tip" role="status"></span>
        </span>
        <button type="button" class="icon-btn again mob-only">重查</button>
      </div>
    </div>
    ${showRisk ? riskChipsHtml(r) : ""}
    ${addrHtml}
    ${r.note && !isBldg ? `<div class="note">${esc(r.note)}</div>` : ""}
    ${noCoord}
    <dl>
      ${unitRow}
      <dt>構造</dt><dd>${v(r.structure)}</dd>
      <dt>建物型態</dt><dd>${v(r.btype)}</dd>
      <dt>屋齡</dt><dd>${age}${r.year_kind === "建照年" ? `<br><small class="rx">臺北市建照套繪圖只收民國 90 年後的建照；舊建物改建、增建也會領新建照，不一定是興建年</small>` : ""}</dd>
      ${showRisk ? `<dt>主要用途</dt><dd>${v(r.usage)}${r.usage_source ? ` <small class="rx">（${esc(r.usage_source)}）</small>` : ""}${r.usage_floors ? `<div class="ufl">${r.usage_floors.split("；").map(x => `<div>${esc(x)}</div>`).join("")}</div>` : ""}</dd>
      <dt>使用分區</dt><dd>${v(r.zoning)}</dd>` : ""}
      <dt>資料來源</dt><dd>${v(r.source)}${r.level ? ` <small class="rx">（${esc(r.level)}）</small>` : ""}</dd>
      ${r.t_n != null ? `<dt>實價筆數</dt><dd>${v(r.t_n)}</dd>` : ""}
      ${bldg && bldg.n_units ? `<dt>同棟門牌</dt><dd>${esc(bldg.n_units)} 個</dd>` : ""}
    </dl>
    ${areaLink ? `<a class="area-bar" id="areaBar" href="${areaLink}"><span>${esc(areaLabel)}區域概況</span><span class="area-go">區域統計 ›</span></a>` : ""}
    ${bldg && bldg.note ? `<div class="note">${bldg.osm ? "OSM 建物：" : ""}${esc(bldg.note)}</div>` : ""}
    ${bldg && String(bldg.source || "").includes("建照套繪") ? `<div class="note">臺北市建照套繪圖是一張建照一個外框，只記最高樓層；同一張建照裡較低的部分（裙樓、附屬建物等）也會被畫成同樣高度。</div>` : ""}
    ${bldg && bldg.addresses?.length ? `<details class="addrs-fold fold-card"><summary>查看同棟門牌（顯示 ${bldg.addresses.length}${bldg.n_units > bldg.addresses.length ? ` / 共 ${bldg.n_units}` : ""} 筆）</summary><div class="addrs">${bldg.addresses.map(esc).join("<br>")}</div></details>` : ""}
  </div>`;
}

async function hydrateAreaBar(cardEl, r) {
  const bar = cardEl.querySelector("#areaBar");
  if (!bar || !r.county) return;
  const d = await getDashboard(r.county, r.town);
  if (!d || !bar.isConnected) return;
  const yrows = (d.price?.["全部"]?.Y || []).filter(row => row[1] >= 5);
  const cutoff = d.latest_trade ? Date.parse(d.latest_trade + "T00:00:00Z") - 30 * 864e5 : null;
  const full = cutoff != null ? yrows.filter(row => Date.UTC(+row[0].slice(0, 4) + 1, 0, 1) <= cutoff + 864e5) : yrows;
  const last = full.at(-1) || yrows.at(-1);
  if (!last) return;
  const areaLabel = r.town || r.county;
  bar.href = `/stats?county=${encodeURIComponent(r.county)}${r.town ? `&town=${encodeURIComponent(r.town)}` : ""}`;
  bar.innerHTML = `<span>${esc(areaLabel)} ${last[0].slice(0, 4)} 年住宅中位數 <strong>${wanPing(last[3])}/坪</strong></span><span class="area-go">區域統計 ›</span>`;
}

async function showBuilding(uid, fly = false) {
  const seq = ++resultSeq;
  setPin(null);
  select(uid);  // 立即上橘色回饋，不等 API
  showLoading();
  let resp;
  try { resp = await fetch(`/api/building/${encodeURIComponent(uid)}`); } catch { if (seq === resultSeq) netError(); return; }
  if (seq !== resultSeq) return;
  if (!resp.ok) { await showError(resp, seq); return; }
  const b = await resp.json();
  if (seq !== resultSeq) return;
  const first = (b.addresses || [])[0];
  const addr = first ? `${b.county || ""}${first}` : (b.name || `地圖建物 ${uid}`);
  syncPageUrl({ bldg: uid }, b.name || first || "建物詳情", b.county, b.town);
  if (fly && b.lon != null && b.lat != null) {
    const near = savedView && Math.hypot(savedView.center[0] - b.lon, savedView.center[1] - b.lat) < 0.005;
    if (fly === "init") { if (!near) map.jumpTo({ center: [b.lon, b.lat], zoom: 17.5, pitch: 55 }); }
    else map.flyTo({ center: [b.lon, b.lat], zoom: 17.5, pitch: 55 });
  }
  document.getElementById("result").innerHTML = renderCard(b, { isBldg: true, bldg: b });
  const cardEl = document.getElementById("result").querySelector(".card");
  if (b.trades?.length) { cardEl.insertAdjacentHTML("beforeend", tradesHtml(b)); tradeChart(cardEl, b); }
  cardEl.insertAdjacentHTML("beforeend", riskHtml(b));
  cardEl.insertAdjacentHTML("beforeend", feedbackHtml({ normalized: addr, floors_above: b.floors_above }, uid));
  cardEl.insertAdjacentHTML("beforeend", `<button type="button" class="again bottom-again mob-only">查詢其他地址</button>`);
  hydrateAreaBar(cardEl, b);
  announce(`已載入建物：${b.name || first || ""}，地上 ${b.floors_above ?? "未知"} 層`);
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();

  hideSugg();

async function doLookup(q, via) {
  const seq = ++resultSeq;
  showLoading();
  let resp;
  try { resp = await fetch(`/api/lookup?q=${encodeURIComponent(q)}${via && via !== "init" ? `&via=${via}` : ""}`); }
  catch { if (seq === resultSeq) netError(); return; }
  if (seq !== resultSeq) return;
  if (!resp.ok) { await showError(resp, seq); return; }
  const r = await resp.json();
  if (seq !== resultSeq) return;
  const noCoord = r.lon == null && r.county && r.confidence !== "無" && r.confidence !== "待確認"
    ? `<div class="note">${esc(r.county)}沒有開放門牌座標資料，地圖無法定位到這個門牌（樓層資料來自實價登錄）。</div>` : "";
  const uid = r.osm_uid || r.bldg_uid;
  const bldg = r.building !== undefined ? r.building
    : uid ? await fetch(`/api/building/${encodeURIComponent(uid)}`).then(x => x.ok ? x.json() : null).catch(() => null) : null;
  if (seq !== resultSeq) return;
  const fullQ = r.normalized ? (r.county && !r.normalized.startsWith(r.county) ? `${r.county}${r.town || ""}${r.normalized}` : r.normalized) : q;
  syncPageUrl({ q: fullQ }, fullQ, r.county, r.town);
  setPin(r.lon != null ? r : null);
  if (r.lon != null) {
    const view = viewOf(r, bldg);
    const near = savedView && Math.hypot(savedView.center[0] - view.center[0], savedView.center[1] - view.center[1]) < 0.005;
    if (via === "init") { if (!near) map.jumpTo(view); }
    else map.flyTo(view);
  }
  select(uid);
  document.getElementById("result").innerHTML = renderCard(r, { isBldg: false, bldg, noCoord });
  const cardEl = document.getElementById("result").querySelector(".card");
  if (r.trades?.length) { cardEl.insertAdjacentHTML("beforeend", tradesHtml(r)); tradeChart(cardEl, r); }
  if (r.normalized && r.confidence !== "待確認") cardEl.insertAdjacentHTML("beforeend", riskHtml(r));
  if (r.normalized && r.confidence !== "待確認") cardEl.insertAdjacentHTML("beforeend", feedbackHtml(r));
  cardEl.insertAdjacentHTML("beforeend", `<button type="button" class="again bottom-again mob-only">查詢其他地址</button>`);
  hydrateAreaBar(cardEl, r);
  announce(`查詢完成：${fullQ}，地上 ${r.floors_above ?? "未知"} 層，信心${r.confidence || "無"}`);
  if (matchMedia("(max-width: 760px)").matches) {
    document.getElementById("mapWrap").scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (via === "pick") {
    cardEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  if (r.confidence === "無" || r.confidence === "待確認") {
    const items = (await fetch(`/api/suggest?q=${encodeURIComponent(q)}`).then(x => x.ok ? x.json() : []).catch(() => []))
      .filter(x => x.kind !== "road" && x.text !== r.normalized);
    if (items.length && seq === resultSeq) document.getElementById("result").insertAdjacentHTML("beforeend",
      `<div class="didyou"><h2>你是不是要找</h2>${items.map(sgHtml).join("")}</div>`);
  }
}
