// ── 打字時的模糊搜尋建議（/api/suggest，支援完整 ARIA combobox 與鍵盤捲動跟隨） ──
const qEl = document.getElementById("q"), suggEl = document.getElementById("sugg");
let suggItems = [], suggOn = -1, suggTimer, suggSeq = 0;
function sgHtml(x, i) {
  const dot = x.has ? `<span class="dot" aria-hidden="true">●</span> ` : "";
  return `<button type="button" class="sg" role="option" id="sg-${i}" aria-selected="false" data-text="${esc(x.kind === "name" ? x.addr : x.text)}" data-kind="${esc(x.kind)}">${dot}${esc(x.text)}`
    + `${x.hint ? `<small>${esc(x.hint)}</small>` : ""}</button>`;
}
function hideSugg() {
  suggEl.hidden = true;
  suggOn = -1;
  qEl.setAttribute("aria-expanded", "false");
  qEl.removeAttribute("aria-activedescendant");
}
let lastSubmitted = "";
async function updateSugg() {
  const q = qEl.value.trim();
  if (q.length < 2 || q === lastSubmitted) { hideSugg(); return; }
  const seq = ++suggSeq;
  const resp = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`).catch(() => null);
  if (!resp?.ok) { hideSugg(); return; }
  const items = await resp.json();
  if (seq !== suggSeq) return;
  suggItems = items; suggOn = -1;
  suggEl.innerHTML = items.map(sgHtml).join("");
  suggEl.hidden = !items.length;
  qEl.setAttribute("aria-expanded", String(items.length > 0));
  qEl.removeAttribute("aria-activedescendant");
}
function chooseSugg(text, kind) {
  qEl.value = text; syncClear();
  hideSugg();
  if (kind === "road") { qEl.focus(); updateSugg(); return; }
  lastSubmitted = text;
  doLookup(text, "suggest");
}
const qClear = document.getElementById("qClear");
const syncClear = () => { qClear.hidden = !qEl.value; };
qEl.addEventListener("input", () => { syncClear(); clearTimeout(suggTimer); suggTimer = setTimeout(updateSugg, 200); });
qClear.addEventListener("click", () => {
  clearTimeout(suggTimer); suggSeq++;
  qEl.value = ""; lastSubmitted = ""; hideSugg(); syncClear(); qEl.focus();
});
qEl.addEventListener("keydown", e => {
  if (suggEl.hidden || !suggItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    suggOn = (suggOn + (e.key === "ArrowDown" ? 1 : -1) + suggItems.length) % suggItems.length;
    const opts = suggEl.querySelectorAll(".sg");
    opts.forEach((b, i) => {
      const on = i === suggOn;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
    });
    const active = opts[suggOn];
    if (active) {
      qEl.setAttribute("aria-activedescendant", active.id);
      active.scrollIntoView({ block: "nearest" });
    }
  } else if (e.key === "Enter" && suggOn >= 0) {
    e.preventDefault();
    const it = suggItems[suggOn];
    chooseSugg(it.kind === "name" ? it.addr : it.text, it.kind);
  } else if (e.key === "Escape") hideSugg();
});
qEl.addEventListener("blur", () => setTimeout(hideSugg, 150));
document.getElementById("result").addEventListener("click", e => {
  const b = e.target.closest(".sg"); if (b) chooseSugg(b.dataset.text, b.dataset.kind);
  const chip = e.target.closest('a.chip[href="#risk-detail"]');
  if (chip) {
    const target = document.getElementById("risk-detail");
    if (target) { e.preventDefault(); target.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }
});
suggEl.addEventListener("mousedown", e => {
  const b = e.target.closest(".sg"); if (b) { e.preventDefault(); chooseSugg(b.dataset.text, b.dataset.kind); }
});

// ── 建物風險與安全防護詳情（建築結構與使用性質已整合進卡片主欄，此區不重複） ──
function hz(x) {
  if (x == null) return `<span class="rx">—（沒有門牌座標）</span>`;
  if (x === NOT_IN_ZONE) return `<span class="rn">${x}</span>`;
  if (x === NO_MAP) return `<span class="rx">${x}</span>`;
  return `<span class="rz">${esc(x)}</span>`;
}
const dist = m => m >= 1000 ? `${(m / 1000).toFixed(1)} 公里` : `${m} 公尺`;
function hydrant(r) {
  if (r.lon == null) return hz(null);
  if (r.hydrants_100m == null) return hz(NO_MAP);
  return r.hydrant_m != null ? `直線 ${dist(r.hydrant_m)}` : "2 公里內沒有";
}
function riskHtml(r) {
  const flood = d => d && d !== NOT_IN_ZONE && d !== NO_MAP ? `${d} 公尺` : d;
  return `<div class="risk" id="risk-detail"><h3>安全防護與災害潛勢</h3>
    ${r.risk_note ? `<div class="note">${esc(r.risk_note)}</div>` : ""}
    <h4>安全防護</h4><dl>
      <dt>最近消防分隊</dt><dd>${r.fire_station ? `${esc(r.fire_station.replace(/^.*?消防局/, ""))}（直線 ${dist(r.fire_station_m)}）` : hz(r.lon == null ? null : NO_MAP)}</dd>
      <dt>最近消防栓</dt><dd>${hydrant(r)}</dd>
      <dt>100m 內消防栓</dt><dd>${r.hydrants_100m != null ? `${esc(r.hydrants_100m)} 支` : hz(r.lon == null ? null : NO_MAP)}</dd></dl>
    <h4>災害潛勢</h4><dl>
      <dt>淹水 500mm</dt><dd>${hz(flood(r.flood500))}</dd>
      <dt>淹水 650mm</dt><dd>${hz(flood(r.flood650))}</dd>
      <dt>土壤液化</dt><dd>${hz(r.liquefaction)}</dd>
      <dt>活動斷層</dt><dd>${hz(r.fault)}</dd>
      <dt>山崩地滑</dt><dd>${hz(r.landslide)}</dd>
      <dt>土石流</dt><dd>${hz(r.debris)}</dd></dl>
    <div class="note">消防分隊、消防栓為直線距離，不是道路距離。淹水為 24 小時累積雨量 500／650mm 情境的模擬淹水深度；活動斷層、山崩地滑為地質敏感區；土石流為潛勢溪流影響範圍。潛勢圖僅供防災參考，不代表實際會發生，也不適用於土地使用管制（水利署、地調所、農業部資料，<a href="/about">來源</a>）。土壤液化為地調所全國圖資（澎湖、金門、連江沒有）。</div>
  </div>`;
}

// ── 實價登錄成交紀錄 ──
const M2_PER_PING = 3.305785, TRADES_SHOWN = 5;
const wan = x => x == null ? "—" : Math.round(x / 1e4).toLocaleString("zh-TW");
function tradeRows(ts, showBase) {
  return ts.map(t => {
    const extra = [showBase ? t.base : "", t.park_price > 0 ? `含車位 ${wan(t.park_price)} 萬` : "", t.kind === "預售屋" ? "預售屋" : "",
                   (t.note || "").replace(/[；;\s]+$/, "")].filter(Boolean).join("；");
    return `<tr><td>${esc(t.trade_date || "—")}</td><td class="n">${t.floor != null ? `${esc(t.floor)} 樓` : "—"}</td>
      <td class="n">${wan(t.total_price)} 萬</td>
      <td class="n">${t.unit_price ? `${(t.unit_price * M2_PER_PING / 1e4).toFixed(1)} 萬` : "—"}</td></tr>
      ${extra ? `<tr class="tnote"><td colspan="4">${esc(extra)}</td></tr>` : ""}`;
  }).join("");
}
function tradesHtml(r) {
  const head = `<thead><tr><th scope="col">成交日期</th><th scope="col" class="n">樓層</th><th scope="col" class="n">總價</th><th scope="col" class="n">每坪</th></tr></thead>`;
  const rest = r.trades.slice(TRADES_SHOWN);
  const showBase = new Set(r.trades.map(t => t.base)).size > 1;
  const main = r.trades_base && r.normalized && !r.normalized.endsWith(r.trades_base)
    ? `<div class="note">這個門牌沒有自己的成交紀錄，以下是主號 ${esc(r.trades_base)} 的紀錄。</div>` : "";
  const statsUrl = r.county ? `/stats?county=${encodeURIComponent(r.county)}${r.town ? `&town=${encodeURIComponent(r.town)}` : ""}` : "";
  const statsBtn = statsUrl ? `<a class="pill-link trades-stats-link" href="${statsUrl}">${esc(r.town || r.county)}行情 ›</a>` : "";
  return `<div class="risk"><div class="sec-head"><h3>實價登錄成交紀錄</h3>${statsBtn}</div>${main}
    <div class="tchart" hidden><div class="tsum"></div><div class="tplot"></div><div class="note tcap"></div></div>
    <div class="tbl-wrap"><table class="trades">${head}<tbody>${tradeRows(r.trades.slice(0, TRADES_SHOWN), showBase)}</tbody></table></div>
    ${rest.length ? `<details class="more-trades fold-card"><summary>展開其餘 ${rest.length} 筆${r.trades.length >= 300 ? "（最多列 300 筆）" : ""}</summary>
      <div class="tbl-wrap"><table class="trades"><tbody>${tradeRows(rest, showBase)}</tbody></table></div></details>` : ""}
    <div class="note">內政部實價登錄${r.county === "臺北市" ? "與臺北市實價週報" : ""}的買賣紀錄，新到舊排列，租賃不列。價格照原始申報，總價含車位、沒有調整；親友間交易、含增建等特殊情形見各筆備註。僅供參考，以<a href="https://lvr.land.moi.gov.tw/" target="_blank" rel="noopener">內政部實價登錄</a>公告為準，本站不提供估價。</div>
  </div>`;
}

// ── 單價走勢圖（散點也可滑過／點擊檢視該筆日期、樓層、單價與總價） ──
const MIN_TREND = 3, TREND_FROM = 2013;
const median = a => { const v = [...a].sort((x, y) => x - y), m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const wanPing = v => `${(v / 1e4).toFixed(v >= 1e6 ? 0 : 1)} 萬`;
async function tradeChart(cardEl, r) {
  const box = cardEl.querySelector(".tchart");
  const ok = (r.trades || []).filter(t => t.unit_price > 0 && !t.special && t.grp && t.trade_date);
  if (!box || ok.length < MIN_TREND) return;
  let charts;
  try { charts = await import("/charts.js?v=3"); } catch { return; }
  const grp = Object.entries(ok.reduce((a, t) => (a[t.grp] = (a[t.grp] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1])[0][0];
  const pts = ok.filter(t => t.grp === grp).map(t => [charts.ms(t.trade_date), t.unit_price * M2_PER_PING,
    { date: t.trade_date, floor: t.floor, total: t.total_price }]);
  const byYear = {};
  for (const [x, val] of pts) (byYear[new Date(x).getUTCFullYear()] ||= []).push(val);
  const years = Object.keys(byYear).map(Number).filter(y => byYear[y].length >= 2).sort();
  const own = years.map(y => [Date.UTC(y, 6, 1), median(byYear[y])]);
  let area = [], areaName = "", d = null;
  if (r.county && r.town) {
    d = await getDashboard(r.county, r.town);
    const y0 = new Date(Math.min(...pts.map(p => p[0]))).getUTCFullYear() - 1;
    area = (d?.price?.[grp]?.Y || []).filter(row => row[1] >= 5 && +row[0].slice(0, 4) >= y0)
      .map(row => [Date.UTC(+row[0].slice(0, 4), 6, 1), row[3]]);
    areaName = `${r.town}${grp}`;
  }
  if (!box.isConnected) return;
  box.hidden = false;
  navigator.sendBeacon?.("/api/event", "trend");
  const areaAt = y => area.find(([x]) => new Date(x).getUTCFullYear() === y)?.[1];
  const pctTxt = v => `${v >= 0 ? "+" : ""}${Math.round(v * 100)}%`;
  let sum = "";
  const sy = years.filter(y => y >= TREND_FROM);
  if (sy.length >= 2 && sy.at(-1) - sy[0] >= 3) {
    const [a, b] = [sy[0], sy.at(-1)], va = median(byYear[a]), vb = median(byYear[b]);
    const aa = areaAt(a), ab = areaAt(b);
    sum = `${a} 年每坪約 ${wanPing(va)} → ${b} 年 ${wanPing(vb)}（${pctTxt(vb / va - 1)}）`
      + (aa && ab ? `；同期${esc(areaName)} ${pctTxt(ab / aa - 1)}` : "");
  }
  if (years.length && areaAt(years.at(-1))) {
    const y = years.at(-1), diff = median(byYear[y]) / areaAt(y) - 1;
    sum += `${sum ? "。" : ""}${y} 年比${esc(areaName)}中位數${diff >= 0 ? "高" : "低"} ${Math.abs(Math.round(diff * 100))}%`;
  }
  box.querySelector(".tsum").innerHTML = sum ? `<b>${sum}</b>` : `<span class="note">成交筆數少，還看不出趨勢</span>`;
  charts.lineChart(box.querySelector(".tplot"), [
    ...(area.length ? [{ name: areaName, color: "var(--parent)", dash: "5 4", width: 1.5, points: area }] : []),
    { name: "每筆成交", color: "var(--accent)", dots: true, points: pts },
    ...(own.length ? [{ name: "這棟（年中位數）", color: "var(--accent)", points: own }] : []),
  ], {
    height: 170,
    yFmt: v => `${Math.round(v / 1e4)}萬`,
    tipFmt: v => `${wanPing(v)}/坪`,
    dotFmt: ([, y, m]) => `<b>${esc(m.date)}${m.floor != null ? ` · ${esc(m.floor)} 樓` : ""}</b><br>單價 ${wanPing(y)}/坪${m.total ? `<br>總價 ${wan(m.total)} 萬` : ""}`,
    label: "這棟的每坪單價",
  });
  const statsBtn = cardEl.querySelector(".trades-stats-link");
  if (statsBtn && r.county) {
    statsBtn.href = `/stats?county=${encodeURIComponent(r.county)}${r.town ? `&town=${encodeURIComponent(r.town)}` : ""}&grp=${encodeURIComponent(grp)}`;
  }
  box.querySelector(".tcap").innerHTML = `每坪單價（萬元）。點＝每筆${esc(grp)}買賣（滑過或點擊看明細），實線＝這棟逐年中位數（該年 2 筆以上）`
    + (area.length ? `，虛線＝${esc(areaName)}中位數` : "") + `。已排除親友間、含增建等特殊交易；單價受樓層、坪數、屋況影響，只是粗略趨勢，不是估價。`;
}

// ── 問題回報（補上網路錯誤處理，避免按鈕卡在停用狀態） ──
const FB_KINDS = [["floors", "樓層錯誤"], ["address", "地址或位置錯誤"], ["shape", "建物形狀或立體圖錯誤"],
  ["info", "年份、構造或用途錯誤"], ["hazard", "災害潛勢或消防資訊錯誤"], ["site", "網站功能或建議"], ["other", "其他問題"]];
document.querySelector(".fb-general select").innerHTML = FB_KINDS.filter(([k]) => k !== "floors")
  .map(([k, t]) => `<option value="${k}">${t}</option>`).join("");
function feedbackHtml(r, building = "") {
  const addr = r.county && !r.normalized.startsWith(r.county) ? `${r.county}${r.town || ""}${r.normalized}` : r.normalized;
  return `<details class="fb fold-card"><summary>資料有誤？回報問題</summary>
    <form class="fbform" data-addr="${esc(addr)}" data-shown="${esc(r.floors_above ?? "")}" data-bldg="${esc(building)}">
      <label class="wide">問題類型<select name="kind">${FB_KINDS.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
      <label class="fl">地上樓層<input name="floors_above" type="number" min="1" max="110"></label>
      <label class="fl">地下樓層<input name="floors_below" type="number" min="0" max="20" placeholder="可不填"></label>
      <label class="wide fd" hidden>說明<textarea name="detail" maxlength="500" rows="3" placeholder="例：這裡應該只有一棟、地址對到隔壁、年份不對"></textarea></label>
      <label class="wide">依據<input name="basis" maxlength="200" placeholder="例：住在這裡、使用執照、建案資料"></label>
      <label class="wide">聯絡方式<input name="contact" maxlength="100" placeholder="可不填（需要確認時聯絡你）"></label>
      <div class="wide fbbtns"><button type="submit">送出</button><span class="fbmsg hint" aria-live="polite"></span></div>
      <div class="hint wide">不知道正確資料也可以：什麼都不填直接送出，就是「標記這筆有誤」。</div>
    </form></details>`;
}
document.getElementById("result").addEventListener("click", e => {
  if (e.target.closest(".again")) document.querySelector(".tabs").scrollIntoView({ behavior: "smooth", block: "start" });
});
document.addEventListener("change", e => {
  if (e.target.name !== "kind") return;
  const f = e.target.closest(".fbform"), floors = e.target.value === "floors";
  if (!f.querySelector(".fl")) return;
  f.querySelectorAll(".fl").forEach(l => l.hidden = !floors);
  f.querySelector(".fd").hidden = floors;
});
async function sendFeedback(f, data) {
  const msg = f.querySelector(".fbmsg"), btns = f.querySelectorAll("button");
  btns.forEach(b => b.disabled = true); msg.textContent = "送出中…";
  if (f.dataset.addr !== undefined) Object.assign(data, { address: f.dataset.addr, shown: f.dataset.shown, building: f.dataset.bldg });
  let resp;
  try {
    resp = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  } catch {
    msg.textContent = "連線失敗，請稍後再試";
    btns.forEach(b => b.disabled = false);
    return;
  }
  const out = await resp.json().catch(() => ({}));
  if (resp.ok) { msg.textContent = "已收到，謝謝！確認後會更新。"; f.querySelectorAll("input, select, textarea").forEach(i => i.disabled = true); }
  else { msg.textContent = out.detail || `送出失敗（${resp.status}）`; btns.forEach(b => b.disabled = false); }
}
document.addEventListener("submit", e => {
  const f = e.target.closest(".fbform"); if (!f) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f));
  const filled = ["floors_above", "floors_below", "detail", "basis"].some(k => String(data[k] || "").trim());
  if (f.dataset.addr !== undefined && !filled) data.quick = true;
  sendFeedback(f, data);
});

// ── 用選的：縣市 → 鄉鎮市區 → 路街 → 巷弄 → 門牌號（/api/pick） ──
const LEVELS = ["county", "town", "road", "lane"];
const LEVEL_NAME = { county: "縣市", town: "鄉鎮市區", road: "路／街", lane: "巷弄", door: "門牌號" };
const pick = { county: "", town: "", road: "", lane: null };
const tilesEl = document.getElementById("tiles"), filterEl = document.getElementById("pickFilter");
let pickItems = [], pickLevel = "county", pickLoaded = false;
const laneLabel = l => l === "" ? "沿路門牌" : l;
const isSet = k => k === "lane" ? pick.lane != null : pick[k] !== "";

let pickSeq = 0;
async function loadPick() {
  pickLoaded = true;
  const seq = ++pickSeq;
  const p = new URLSearchParams();
  for (const k of LEVELS) if (isSet(k)) p.set(k, pick[k]);
  tilesEl.innerHTML = `<span class="hint">載入中…</span>`;
  let r;
  try {
    const resp = await fetch(`/api/pick?${p}`);
    if (!resp.ok) throw new Error(resp.status);
    r = await resp.json();
  } catch {
    if (seq === pickSeq) tilesEl.innerHTML = `<span class="hint">載入失敗，請稍後再試</span>`;
    return;
  }
  if (seq !== pickSeq) return;
  pickLevel = r.level; pickItems = r.items;
  if (r.level === "door") pick.lane = r.lane;
  filterEl.value = "";
  filterEl.hidden = pickItems.length <= 40;
  filterEl.placeholder = r.level === "door" ? "篩選門牌號，例：390" : `篩選${LEVEL_NAME[r.level]}，例：${r.level === "road" ? "中山" : "1"}`;
  renderCrumbs(); renderTiles();
}

function renderCrumbs() {
  const chosen = LEVELS.filter(isSet);
  document.getElementById("crumbs").innerHTML =
    (chosen.length ? `<button type="button" data-back="-1">全部</button>` : "")
    + chosen.map((k, i) => `<span class="cur">›</span><button type="button" data-back="${i}">${esc(k === "lane" ? laneLabel(pick[k]) : pick[k])}</button>`).join("")
    + `<span class="cur">${chosen.length ? "›" : ""} 選${LEVEL_NAME[pickLevel]}</span>`;
}
function tileFade() {
  tilesEl.classList.toggle("more", tilesEl.scrollHeight - tilesEl.scrollTop - tilesEl.clientHeight > 4);
}
tilesEl.addEventListener("scroll", tileFade, { passive: true });
window.addEventListener("resize", tileFade);

function renderTiles() {
  const f = filterEl.value.trim();
  const items = f ? pickItems.filter(x => (pickLevel === "lane" ? laneLabel(x.name) : x.name).includes(f)) : pickItems;
  tilesEl.className = "tiles" + (pickLevel === "door" ? " num" : pickLevel === "road" || pickLevel === "lane" ? " wide" : "");
  tilesEl.innerHTML = items.length ? items.map(x => {
    const label = pickLevel === "lane" ? laneLabel(x.name) : x.name;
    const sub = pickLevel === "county" ? `${x.n} 區` : pickLevel === "door" ? "" : `${x.n.toLocaleString()} 門牌`;
    const has = pickLevel === "door" ? x.has : false;
    return `<button type="button" class="tile${has ? " has" : ""}" data-i="${pickItems.indexOf(x)}">${esc(label)}${sub ? `<small>${sub}</small>` : ""}</button>`;
  }).join("") : `<span class="hint">沒有符合的${LEVEL_NAME[pickLevel]}</span>`;
  tilesEl.scrollTop = 0;
  tileFade();
  document.getElementById("pickHint").innerHTML = pickLevel === "door"
    ? `<span style="color:var(--hi)">●</span> 這個門牌自己有實價登錄（最可能查到樓層）；沒有的也會用同棟、同巷推估`
    : pickLevel === "road" ? "依門牌數排序，常見的路在前面" : "";
}

tilesEl.addEventListener("click", e => {
  const b = e.target.closest(".tile"); if (!b) return;
  const x = pickItems[+b.dataset.i];
  if (pickLevel === "door") {
    const q = pick.county + pick.town + x.base;
    document.getElementById("q").value = q; syncClear();
    tilesEl.querySelectorAll(".tile").forEach(t => t.style.outline = "");
    b.style.outline = "2px solid var(--accent)";
    doLookup(q, "pick");
    return;
  }
  pick[pickLevel] = x.name;
  loadPick();
});
document.getElementById("crumbs").addEventListener("click", e => {
  const b = e.target.closest("button[data-back]"); if (!b) return;
  const keep = +b.dataset.back;
  LEVELS.forEach((k, i) => { if (i > keep) pick[k] = k === "lane" ? null : ""; });
  loadPick();
});
filterEl.addEventListener("input", renderTiles);

// ── 3 分頁（輸入地址｜選擇地址｜整批查詢）：完整 ARIA tablist 與方向鍵切換 ──
const TABS = [
  { key: "type", btn: document.getElementById("tabType"), panel: document.getElementById("typeBox") },
  { key: "pick", btn: document.getElementById("tabPick"), panel: document.getElementById("pickBox") },
  { key: "batch", btn: document.getElementById("tabBatch"), panel: document.getElementById("batchBox") },
];
function setTab(key, focusInput = false) {
  if (!TABS.some(t => t.key === key)) key = "type";
  for (const t of TABS) {
    const on = t.key === key;
    t.btn.setAttribute("aria-selected", String(on));
    t.btn.tabIndex = on ? 0 : -1;
    t.panel.hidden = !on;
  }
  if (key === "pick" && !pickLoaded) loadPick();
  if (key === "type" && focusInput) qEl.focus();
  try { localStorage.setItem("searchTab", key); } catch {}
}
const tablist = document.querySelector(".tabs");
tablist.addEventListener("click", e => {
  const btn = e.target.closest('[role="tab"]'); if (!btn) return;
  const t = TABS.find(x => x.btn === btn);
  if (t) setTab(t.key, true);
});
tablist.addEventListener("keydown", e => {
  const cur = TABS.findIndex(x => x.btn === document.activeElement);
  if (cur < 0) return;
  let next = cur;
  if (e.key === "ArrowRight") next = (cur + 1) % TABS.length;
  else if (e.key === "ArrowLeft") next = (cur - 1 + TABS.length) % TABS.length;
  else if (e.key === "Home") next = 0;
  else if (e.key === "End") next = TABS.length - 1;
  else return;
  e.preventDefault();
  setTab(TABS[next].key, false);
  TABS[next].btn.focus();
});

// ── 地圖點選與 Hover 建物輕量預覽＋立體微亮回饋（零額外 API 請求） ──
const bldgTip = document.getElementById("bldgTip");
function setHover(next) {
  if (hoverTarget?.prop === next?.prop && hoverTarget?.val === next?.val) return;
  hoverTarget = next;
  if (!MAP_OK || !mapReady) return;
  const flt = next && !(next.prop === "uid" && next.val === selectedUid)
    ? ["all", ["==", ["get", next.prop], next.val], GROUND_FILTER] : NONE_FILTER;
  map.setFilter("bldg-hover", flt);
  applyBldgColors();
}
const hideTip = () => { bldgTip.hidden = true; setHover(null); };
if (MAP_OK) {
  map.on("click", "bldg", e => {
    hideTip();
    const p = e.features[0].properties;
    if (p.pillar) { qEl.value = p.addr; lastSubmitted = p.addr; syncClear(); doLookup(p.addr, "pillar"); }
    else showBuilding(p.uid);
  });
  if (matchMedia("(hover: hover)").matches) {
    map.on("mousemove", "bldg", e => {
      map.getCanvas().style.cursor = "pointer";
      const p = e.features[0]?.properties;
      if (!p) { hideTip(); return; }
      setHover(p.uid ? { prop: "uid", val: p.uid } : p.addr ? { prop: "addr", val: p.addr } : null);
      const title = p.name || (p.pillar ? p.addr : "");
      const fl = p.floors != null ? `地上 ${esc(p.floors)} 層` : "樓層未知";
      bldgTip.innerHTML = `${title ? `<b>${esc(title)}</b><br>` : ""}${fl}<small>點擊查看詳情</small>`;
      bldgTip.hidden = false;
      const maxL = mapWrap.clientWidth - bldgTip.offsetWidth - 16;
      const x = Math.min(Math.max(e.point.x, 8), Math.max(8, maxL));
      const y = Math.min(Math.max(e.point.y, 28), mapWrap.clientHeight - 28);
      bldgTip.style.left = `${x}px`;
      bldgTip.style.top = `${y}px`;
    });
    map.on("mouseleave", "bldg", () => { map.getCanvas().style.cursor = ""; hideTip(); });
    map.on("dragstart", hideTip);
    map.on("zoomstart", hideTip);
  }
}

// ── 整批查詢 ──
const drop = document.getElementById("drop"), fileIn = document.getElementById("file"), msg = document.getElementById("batchMsg");
async function upload(file) {
  msg.textContent = `處理中：${file.name}…`;
  const fd = new FormData(); fd.append("file", file);
  let r;
  try { r = await fetch("/api/batch", { method: "POST", body: fd }); }
  catch { msg.textContent = "失敗：連線中斷，請稍後再試"; return; }
  if (!r.ok) { msg.textContent = `失敗：${(await r.json().catch(() => ({}))).detail || r.status}`; return; }
  const blob = await r.blob();
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: file.name.replace(/\.[^.]+$/, "") + "_樓層.xlsx" });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60_000);
  msg.textContent = `完成：已下載 ${a.download}`;
}
fileIn.addEventListener("change", () => { const f = fileIn.files[0]; fileIn.value = ""; if (f) upload(f); });
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); });

// ── 初始狀態：支援分享連結（?q= 或 ?bldg=），無參數則依上次分頁（預設輸入地址） ──
let savedTab = "type";
try { savedTab = localStorage.getItem("searchTab") || "type"; } catch {}
if (initQ) {
  setTab("type", false);
  qEl.value = initQ; lastSubmitted = initQ; syncClear();
  doLookup(initQ, "init");
} else if (initBldg) {
  setTab(savedTab, false);
  showBuilding(initBldg, "init");
} else {
  setTab(savedTab, false);
  try { sessionStorage.removeItem("lastQueryUrl"); } catch {}
}

fetch("/api/stats").then(r => r.json()).then(rows => {
  const pct = x => `${(x * 100).toFixed(0)}%`;
  document.getElementById("stats").innerHTML =
    `<thead><tr><th scope="col">縣市</th><th scope="col" class="n">門牌號</th><th scope="col" class="n">實價</th><th scope="col" class="n">高＋中</th><th scope="col" class="n">任一</th></tr></thead><tbody>`
    + rows.map(s => `<tr><td>${esc(s.county)}</td><td class="n">${s.addresses.toLocaleString()}</td>`
      + `<td class="n">${pct(s.by_trade)}</td><td class="n">${pct(s.high_mid)}</td><td class="n">${pct(s.any_floor)}</td></tr>`).join("")
    + `<tr><td colspan="5" class="hint">實價＝該門牌自己有實價登錄；高＋中＝含同棟、同巷、附近一致的推估；任一＝再含低信心（建物圖、不一致的同棟、附近七成以上一致、同路一致）</td></tr></tbody>`;
}).catch(() => {});
</script>
