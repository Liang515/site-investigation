<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>地址樓層查詢</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --accent: #1f5fbf; --hi: #1e7a46; --mid: #b7791f; --lo: #b42318;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: var(--ink); background: var(--bg); }
  #app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
  /* 字級只用三種：20 標題、14 內文、12 輔助說明（查詢結果的大數字除外） */
  html, body { font-size: 14px; line-height: 1.5; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; }
  h1 { font-size: 20px; line-height: 28px; margin: 0; font-weight: 700; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; flex: none; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 8px; letter-spacing: .04em; }
  form { display: flex; gap: 6px; }
  input[type=text] { flex: 1; min-width: 0; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; }
  /* 只套用到左側面板的按鈕；地圖上的縮放按鈕用 MapLibre 自己的樣式 */
  :where(aside) button { font-size: 14px; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  :where(aside) button:disabled { opacity: .5; cursor: default; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .big { font-size: 34px; font-weight: 700; line-height: 1; }
  .big small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; margin: 12px 0 0; }
  dd { overflow-wrap: anywhere; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; color: #fff; font-weight: 600; }
  .b-高 { background: var(--hi); } .b-中 { background: var(--mid); } .b-低, .b-無, .b-待確認 { background: var(--lo); }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; overflow-wrap: anywhere; }
  .addrs { font-size: 12px; color: var(--muted); max-height: 120px; overflow-y: auto; margin-top: 8px; }
  .legend { display: flex; gap: 0; font-size: 12px; color: var(--muted); }
  .legend span { flex: 1; text-align: center; padding-top: 14px; position: relative; }
  .legend span::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 10px; background: var(--c); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #drop { display: block; border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--ink); cursor: pointer; line-height: 1.6; background: var(--panel); }
  #drop:hover { border-color: var(--accent); }
  #drop .hint { display: block; margin-top: 6px; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  /* 分頁：整條切換鈕 */
  .tabs { display: flex; padding: 3px; margin-bottom: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .tabs button { flex: 1; background: transparent; color: var(--muted); padding: 7px 0; border-radius: 7px; font-weight: 600; }
  .tabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; margin-bottom: 8px; }
  .crumbs button { background: #eef3fb; color: var(--accent); padding: 4px 10px; font-size: 12px; }
  .crumbs .cur { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; max-height: 300px; overflow-y: auto; padding: 2px; }
  .tiles.wide { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .tiles.num { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
  .tile { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 9px 4px; font-size: 14px; line-height: 1.2; position: relative; }
  .tile:hover { border-color: var(--accent); color: var(--accent); }
  .tile small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile.has::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--hi); }
  #f { position: relative; }
  #sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.08); max-height: 320px; overflow-y: auto; }
  .sg { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); border-radius: 0; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .sg:last-child { border-bottom: 0; }
  .sg:hover, .sg.on { background: #eef3fb; }
  .sg small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sg .dot { color: var(--hi); }
  .didyou { margin-top: 10px; }
  .fb { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .fb summary { cursor: pointer; font-size: 12px; color: var(--accent); }
  .fbform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .fbform label { display: flex; flex-direction: column; gap: 4px; }
  .fbform .wide { grid-column: 1 / -1; }
  .fbform input { font-size: 14px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
  .fbform button { justify-self: start; }
  .card .again { margin-top: 12px; width: 100%; }
  .didyou .sg { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; }
  #pickFilter { width: 100%; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  #map { height: 100%; position: relative; }
  .hint { font-size: 12px; color: var(--muted); }
  .mob-only { display: none; }
  @media (max-width: 760px) {
    html, body { height: auto; }
    /* 手機：標題 → 地圖 → 查詢結果 → 選地址／輸入地址 → 其他 */
    #app { display: flex; flex-direction: column; height: auto; }
    aside, aside > section:first-of-type { display: contents; }
    aside > * { padding: 0 16px; }
    aside > div:first-child { order: 1; padding-top: 12px; padding-bottom: 10px; }
    #map { order: 2; height: 45vh; }
    #result { order: 3; padding: 0 16px; margin-top: 12px !important; }
    #result:empty { display: none; }
    .tabs { order: 4; margin: 16px 16px 12px; }
    #pickBox, #typeBox { order: 5; padding: 0 16px; }
    aside > section:not(:first-of-type) { order: 6; padding-top: 24px; }
    aside > section:last-of-type { padding-bottom: 24px; }
    .tiles { max-height: none; overflow: visible; }  /* 不要在整頁捲動裡再包一層捲動 */
    .crumbs button { padding: 6px 12px; }
    .desk-only { display: none; }
    .mob-only { display: inline !important; }
    .card .again { display: block !important; }
    input[type=text], #pickFilter, .fbform input { font-size: 16px; }  /* iPhone：小於 16px 點輸入框會自動放大 */
    .tiles { max-height: 230px; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; overflow: visible; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div>
      <h1 class="brand"><img src="/logo.png" alt="" width="28" height="28">地址樓層查詢</h1>
      <div class="sub">非官方查詢工具，結果僅供參考 · <a href="/about">資料來源與授權</a></div>
    </div>

    <section>
      <div class="tabs"><button type="button" id="tabPick" class="on">選擇地址</button><button type="button" id="tabType">輸入地址</button></div>
      <div id="pickBox">
        <div class="crumbs" id="crumbs"></div>
        <input id="pickFilter" type="search" placeholder="篩選（可不填）" hidden>
        <div class="tiles" id="tiles"></div>
        <div class="hint" id="pickHint" style="margin-top:6px"></div>
      </div>
      <div id="typeBox" hidden>
        <form id="f" autocomplete="off"><input id="q" type="text" placeholder="地址或地標，例：市政路390號"><button>查詢</button><div id="sugg" hidden></div></form>
        <div class="hint" style="margin-top:6px">可以打錯字、用簡寫或只打一部分，會列出最接近的門牌</div>
      </div>
      <div id="result" style="margin-top:12px"></div>
    </section>

    <section>
      <h2>整批查詢</h2>
      <label id="drop"><b class="desk-only">拖曳 Excel / CSV 到這裡</b><span class="desk-only">，或點擊選檔</span><b class="mob-only">點擊選擇 Excel / CSV 檔</b><span class="hint">自動找「地址」欄，回傳加上樓層欄位的 Excel<br>一次最多 2,000 筆、4 MB</span>
        <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
      <div id="batchMsg" class="note"></div>
    </section>

    <section>
      <h2>地上樓層</h2>
      <div class="legend" id="legend"></div>
      <div class="hint" style="margin-top:8px">放大到街區可看到 3D 建物，點建物看屬性</div>
    </section>

    <section>
      <details><summary>各縣市涵蓋率</summary><table id="stats"></table></details>
    </section>
  </aside>
  <div id="map"></div>
</div>

<script type="module">
// MapLibre 6（ES module）：4.x 在 Safari 27 會不斷 WebGL context lost，6.12+ 修了 GPU 程序掛掉的處理
// 動態載入：CDN 失敗時只有地圖顯示說明，查詢照常
let maplibregl;
try { maplibregl = await import("https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs"); }
catch (e) { console.error("MapLibre 載入失敗", e); }

const RAMP = [[1, "#d9e6f2"], [3, "#a9c6e3"], [6, "#6f9fd0"], [13, "#3a6fb3"], [21, "#7a3fa0"], [31, "#c2185b"]];
const LABELS = ["1–2", "3–5", "6–12", "13–20", "21–30", "31+"];
document.getElementById("legend").innerHTML =
  RAMP.map((r, i) => `<span style="--c:${r[1]}">${LABELS[i]}</span>`).join("")
  + `<span style="--c:#bdbdbd">未知</span>`;

// 瀏覽器不支援 WebGL（硬體加速關閉、部分公司電腦／遠端桌面）時地圖畫不出來：
// 在地圖區顯示原因，並用不做事的替身物件，讓查詢等其他功能照常運作
function webglOK() {
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
  catch { return false; }
}
const MAP_OK = typeof maplibregl !== "undefined" && webglOK();
const NOOP = new Proxy(function () {}, { get: (t, k) => k === Symbol.toPrimitive ? () => "" : NOOP, apply: () => NOOP });
if (!MAP_OK) {
  document.getElementById("map").innerHTML = `<div style="padding:24px;max-width:460px;color:var(--muted);font-size:14px;line-height:1.7">
    <b style="color:var(--ink)">這個瀏覽器無法顯示 3D 地圖</b><br>
    地圖需要 WebGL。請確認瀏覽器設定裡的「硬體加速」已開啟，或改用最新版 Chrome、Edge、Safari。<br>
    查詢功能不受影響，可以照常使用。</div>`;
}
const map = !MAP_OK ? NOOP : new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      emap: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}"],
        attribution: "© 內政部國土測繪中心" },
      bldg: { type: "geojson", data: { type: "FeatureCollection", features: [] },
        attribution: "建物外框：<a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\">© OpenStreetMap 貢獻者</a>、臺中市政府、臺北市政府｜樓層與門牌：內政部實價登錄、各縣市政府門牌與使用執照資料（<a href=\"/about\">完整來源</a>）" },
      pin: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
    },
    layers: [
      { id: "emap", type: "raster", source: "emap" },
      { id: "bldg", type: "fill-extrusion", source: "bldg", paint: {
          // 沒有樓層、只有 OSM 高度的建物：以 高度÷3.2m 上色
          "fill-extrusion-color": ["case", ["all", ["==", ["get", "floors"], null], ["==", ["get", "h"], null]], "#bdbdbd",
            ["step", ["coalesce", ["get", "floors"], ["/", ["get", "h"], 3.2]], RAMP[0][1], ...RAMP.slice(1).flat()]],
          "fill-extrusion-height": ["coalesce", ["get", "h"], 3.2],
          "fill-extrusion-base": ["coalesce", ["get", "base"], 0],
          "fill-extrusion-opacity": 0.85 } },
      { id: "bldg-sel", type: "line", source: "bldg", filter: ["==", ["get", "uid"], ""],
        paint: { "line-color": "#ff6d00", "line-width": 3 } },
      { id: "pin", type: "circle", source: "pin",
        paint: { "circle-radius": 7, "circle-color": "#ff6d00", "circle-stroke-color": "#fff", "circle-stroke-width": 2 } },
    ],
  },
  center: [121.5654, 25.0355], zoom: 16, pitch: 50, bearing: -15,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl());
window.map = map;  // 方便在主控台除錯

// ── 地圖診斷：只有網址加 ?debug=1 時才在地圖上顯示狀態（一般使用者看不到） ──
const mapErrors = [];
let lostCount = 0;
map.on("error", e => {
  const msg = String(e?.error?.message || e?.error || e).slice(0, 160);
  mapErrors.push(msg);
  // WebGL 一直被瀏覽器收回（例：Safari 27.0）：顯示說明，不要只剩空白
  if (/context lost/i.test(msg) && ++lostCount === 20) showGLLost();
});
function showGLLost() {
  if (document.getElementById("gllost")) return;
  const box = document.createElement("div");
  box.id = "gllost";
  box.style.cssText = "position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)";
  box.innerHTML = `<div style="max-width:440px;color:var(--muted);font-size:14px;line-height:1.7">
    <b style="color:var(--ink)">瀏覽器的 3D 繪圖（WebGL）一直失效，地圖無法顯示</b><br>
    請更新到最新版瀏覽器（Safari：系統設定 → 一般 → 軟體更新），或改用 Chrome。<br>
    查詢功能不受影響，可以照常使用。</div>`;
  document.getElementById("map").appendChild(box);
}
if (MAP_OK) map.getCanvas().addEventListener("webglcontextlost", () => mapErrors.push("WebGL context lost"));
function showDiag(reason) {
  if (!MAP_OK || document.getElementById("diag")) return;
  const c = map.getCanvas();
  const box = document.createElement("div");
  box.id = "diag";
  box.style.cssText = "position:absolute;left:10px;bottom:30px;z-index:9;max-width:440px;background:rgba(255,255,255,.95);border:1px solid #ccc;border-radius:8px;padding:10px 12px;font:12px/1.5 monospace;color:#222;white-space:pre-wrap";
  box.textContent = [`地圖診斷（${reason}）`,
    `loaded=${map.loaded()} style=${map.isStyleLoaded()} 畫布=${c.width}x${c.height} 容器=${map.getContainer().offsetWidth}x${map.getContainer().offsetHeight} dpr=${devicePixelRatio}`,
    `中心=${map.getCenter().lng.toFixed(4)},${map.getCenter().lat.toFixed(4)} zoom=${map.getZoom().toFixed(1)}`,
    `錯誤(${mapErrors.length})：${mapErrors.slice(0, 5).join(" | ") || "無"}`,
    navigator.userAgent].join("\n");
  document.getElementById("map").appendChild(box);
}
if (new URLSearchParams(location.search).has("debug")) setTimeout(() => showDiag("debug"), 6000);

let timer;
async function loadBuildings() {
  if (!MAP_OK) return;
  if (map.getZoom() < 15.5) { map.getSource("bldg").setData({ type: "FeatureCollection", features: [] }); return; }
  const b = map.getBounds();
  const r = await fetch(`/api/buildings?bbox=${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`);
  map.getSource("bldg").setData(await r.json());
}
map.on("moveend", () => { clearTimeout(timer); timer = setTimeout(loadBuildings, 200); });
map.on("load", loadBuildings);
// 資料來源標示一開始就收成 ⓘ（點開才顯示），不擋地圖
map.on("load", () => document.querySelectorAll(".maplibregl-ctrl-attrib.maplibregl-compact-show")
  .forEach(e => e.classList.remove("maplibregl-compact-show")));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const v = x => x == null || x === "" ? "—" : esc(x);
// 標準化地址 → Google 地圖搜尋（官方網址格式，不需金鑰）；輸入沒寫縣市時補上查到的縣市區，避免找到別的城市
function gmapLink(r) {
  if (!r.normalized) return "—";
  const full = r.county && !r.normalized.startsWith(r.county) ? `${r.county}${r.town || ""}${r.normalized}` : r.normalized;
  const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(full)}`;
  const link = `<a href="${esc(url)}" target="_blank" rel="noopener" title="在 Google 地圖開啟">${esc(full)} ↗</a>`;
  // 有門牌座標時加街景：Google 會開在離這個點最近的街景
  const pano = r.lat != null && r.lon != null
    ? ` · <a href="${esc(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${r.lat},${r.lon}`)}" target="_blank" rel="noopener">街景 ↗</a>`
    : "";
  return link + pano;
}

function select(uid) { map.setFilter("bldg-sel", ["==", ["get", "uid"], uid || ""]); }

// 點地圖上的建物：只看建物圖屬性
async function showBuilding(uid) {
  const b = await (await fetch(`/api/building/${encodeURIComponent(uid)}`)).json();
  select(uid);
  document.getElementById("result").innerHTML = card(b, "", b);
}

// 查詢結果（圖資＋實價合併後）為主；有對到建物就附上同棟門牌
function card(r, head, bldg) {
  return `
    <div class="card">
      <div class="big">${v(r.floors_above)}<small>層（地上）</small></div>
      ${head}
      <dl>
        <dt>地下樓層</dt><dd>${v(r.floors_below)}</dd>
        <dt>構造</dt><dd>${v(r.structure)}</dd>
        <dt>建物型態</dt><dd>${v(r.btype)}</dd>
        <dt>${v(r.year_kind || "年份")}</dt><dd>${v(r.year)}</dd>
        <dt>資料來源</dt><dd>${v(r.source)}</dd>
        ${r.t_n != null ? `<dt>實價筆數</dt><dd>${v(r.t_n)}</dd>` : ""}
        ${bldg ? `<dt>同棟門牌</dt><dd>${v(bldg.n_units)}</dd>` : ""}
      </dl>
      ${bldg && bldg.osm && bldg.note ? `<div class="note">OSM 建物：${esc(bldg.note)}</div>` : ""}
      ${bldg && String(bldg.source || "").includes("建照套繪") ? `<div class="note">臺北市建照套繪圖是一張建照一個外框，只記最高樓層；同一張建照裡較低的部分（裙樓、附屬建物等）也會被畫成同樣高度。</div>` : ""}
      ${bldg ? `<div class="addrs">${bldg.addresses.map(esc).join("<br>")}</div>` : ""}
    </div>`;
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  lastSubmitted = q; clearTimeout(suggTimer); suggSeq++;  // 取消還在路上的建議請求
  hideSugg();
  if (q) doLookup(q);
});

async function doLookup(q) {
  const resp = await fetch(`/api/lookup?q=${encodeURIComponent(q)}`);
  if (!resp.ok) {  // 例：查詢太頻繁（429）
    const err = await resp.json().catch(() => ({}));
    document.getElementById("result").innerHTML = `<div class="note">${esc(err.detail || `查詢失敗（${resp.status}）`)}</div>`;
    return;
  }
  const r = await resp.json();
  const head = `<dl style="margin-top:10px">
      <dt>標準化</dt><dd>${gmapLink(r)}</dd>
      <dt>所在樓層</dt><dd>${v(r.unit_floor)}</dd>
      <dt>比對方式</dt><dd>${v(r.level)}</dd>
      <dt>信心</dt><dd><span class="badge b-${esc(r.confidence)}">${esc(r.confidence)}</span></dd>
    </dl>${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}`;
  if (r.lon != null) {
    map.getSource("pin").setData({ type: "Point", coordinates: [r.lon, r.lat] });
    map.flyTo({ center: [r.lon, r.lat], zoom: 18, pitch: 55 });
  }
  // 基隆、南投、嘉義市、宜蘭、連江沒有門牌座標：只有實價登錄，地圖無法定位
  const noCoord = r.lon == null && r.county && r.confidence !== "無" && r.confidence !== "待確認"
    ? `<div class="note">${esc(r.county)}沒有開放門牌座標資料，地圖無法定位到這個門牌（樓層資料來自實價登錄）。</div>` : "";
  // 有 OSM 建物（每棟分開）優先框它，其次市府建物圖
  const uid = r.osm_uid || r.bldg_uid;
  const bldg = uid ? await (await fetch(`/api/building/${encodeURIComponent(uid)}`)).json() : null;
  select(uid);
  document.getElementById("result").innerHTML = card(r, head + noCoord, bldg);
  const cardEl = document.getElementById("result").querySelector(".card");
  if (r.normalized && r.confidence !== "待確認") cardEl.insertAdjacentHTML("beforeend", feedbackHtml(r));
  // 手機：結果在地圖下方、選單更下面，給一顆回到選單的按鈕
  cardEl.insertAdjacentHTML("beforeend", `<button type="button" class="again mob-only">查詢其他地址</button>`);
  // 手機：結果卡片排在地圖正下方，查詢完捲到地圖，地圖與結果一起看
  if (matchMedia("(max-width: 760px)").matches) document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "start" });
  // 查不到時：列出模糊搜尋的候選
  if (r.confidence === "無" || r.confidence === "待確認") {
    const items = (await (await fetch(`/api/suggest?q=${encodeURIComponent(q)}`)).json())
      .filter(x => x.kind !== "road" && x.text !== r.normalized);
    if (items.length) document.getElementById("result").insertAdjacentHTML("beforeend",
      `<div class="didyou"><h2>你是不是要找</h2>${items.map(sgHtml).join("")}</div>`);
  }
}

// ── 打字時的模糊搜尋建議（/api/suggest） ──
const qEl = document.getElementById("q"), suggEl = document.getElementById("sugg");
let suggItems = [], suggOn = -1, suggTimer, suggSeq = 0;
function sgHtml(x, i) {
  const dot = x.has ? `<span class="dot">●</span> ` : "";
  return `<button type="button" class="sg" data-text="${esc(x.text)}" data-kind="${esc(x.kind)}">${dot}${esc(x.text)}`
    + `${x.hint ? `<small>${esc(x.hint)}</small>` : ""}</button>`;
}
function hideSugg() { suggEl.hidden = true; suggOn = -1; }
let lastSubmitted = "";
async function updateSugg() {
  const q = qEl.value.trim();
  if (q.length < 2 || q === lastSubmitted) { hideSugg(); return; }  // 已送出查詢的文字不再跳建議
  const seq = ++suggSeq;
  const resp = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`);
  if (!resp.ok) { hideSugg(); return; }
  const items = await resp.json();
  if (seq !== suggSeq) return;  // 有更新的輸入，丟掉舊結果
  suggItems = items; suggOn = -1;
  suggEl.innerHTML = items.map(sgHtml).join("");
  suggEl.hidden = !items.length;
}
function chooseSugg(text, kind) {
  qEl.value = text;
  hideSugg();
  if (kind === "road") { qEl.focus(); updateSugg(); return; }  // 選了路，接著打門牌號
  doLookup(text);
}
qEl.addEventListener("input", () => { clearTimeout(suggTimer); suggTimer = setTimeout(updateSugg, 200); });
qEl.addEventListener("keydown", e => {
  if (suggEl.hidden || !suggItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    suggOn = (suggOn + (e.key === "ArrowDown" ? 1 : -1) + suggItems.length) % suggItems.length;
    suggEl.querySelectorAll(".sg").forEach((b, i) => b.classList.toggle("on", i === suggOn));
  } else if (e.key === "Enter" && suggOn >= 0) {
    e.preventDefault();
    chooseSugg(suggItems[suggOn].text, suggItems[suggOn].kind);
  } else if (e.key === "Escape") hideSugg();
});
qEl.addEventListener("blur", () => setTimeout(hideSugg, 150));
document.getElementById("result").addEventListener("click", e => {
  const b = e.target.closest(".sg"); if (b) chooseSugg(b.dataset.text, b.dataset.kind);
});
suggEl.addEventListener("mousedown", e => {
  const b = e.target.closest(".sg"); if (b) { e.preventDefault(); chooseSugg(b.dataset.text, b.dataset.kind); }
});

// ── 樓層回報：結果卡片下方的表單，送到 /api/feedback（推播給維護者審核） ──
function feedbackHtml(r) {
  const addr = r.county && !r.normalized.startsWith(r.county) ? `${r.county}${r.town || ""}${r.normalized}` : r.normalized;
  return `<details class="fb"><summary>樓層有誤？回報正確樓層</summary>
    <form class="fbform" data-addr="${esc(addr)}" data-shown="${esc(r.floors_above ?? "")}">
      <label>地上樓層<input name="floors_above" type="number" min="1" max="110" required></label>
      <label>地下樓層<input name="floors_below" type="number" min="0" max="20" placeholder="可不填"></label>
      <label class="wide">依據<input name="basis" maxlength="200" placeholder="例：住在這裡、使用執照、建案資料"></label>
      <label class="wide">聯絡方式<input name="contact" maxlength="100" placeholder="可不填（需要確認時聯絡你）"></label>
      <button type="submit">送出</button><span class="fbmsg hint"></span>
    </form></details>`;
}
document.getElementById("result").addEventListener("click", e => {
  if (e.target.closest(".again")) document.querySelector(".tabs").scrollIntoView({ behavior: "smooth", block: "start" });
});
document.getElementById("result").addEventListener("submit", async e => {
  const f = e.target.closest(".fbform"); if (!f) return;
  e.preventDefault();
  const msg = f.querySelector(".fbmsg"), btn = f.querySelector("button");
  btn.disabled = true; msg.textContent = "送出中…";
  const data = Object.fromEntries(new FormData(f));
  data.address = f.dataset.addr; data.shown = f.dataset.shown;
  const resp = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const out = await resp.json().catch(() => ({}));
  if (resp.ok) { msg.textContent = "已收到，謝謝！確認後會更新。"; f.querySelectorAll("input").forEach(i => i.disabled = true); }
  else { msg.textContent = out.detail || `送出失敗（${resp.status}）`; btn.disabled = false; }
});

// ── 用選的：縣市 → 鄉鎮市區 → 路街 → 巷弄 → 門牌號（/api/pick 回傳下一層） ──
const LEVELS = ["county", "town", "road", "lane"];
const LEVEL_NAME = { county: "縣市", town: "鄉鎮市區", road: "路／街", lane: "巷弄", door: "門牌號" };
const pick = { county: "", town: "", road: "", lane: null };
const tilesEl = document.getElementById("tiles"), filterEl = document.getElementById("pickFilter");
let pickItems = [], pickLevel = "county";
const laneLabel = l => l === "" ? "沿路門牌" : l;
const isSet = k => k === "lane" ? pick.lane != null : pick[k] !== "";

async function loadPick() {
  const p = new URLSearchParams();
  for (const k of LEVELS) if (isSet(k)) p.set(k, pick[k]);
  tilesEl.innerHTML = `<span class="hint">載入中…</span>`;
  const r = await (await fetch(`/api/pick?${p}`)).json();
  pickLevel = r.level; pickItems = r.items;
  if (r.level === "door") pick.lane = r.lane;  // 只有一種巷弄時後端直接給門牌
  filterEl.value = "";
  filterEl.hidden = pickItems.length <= 40;
  filterEl.placeholder = r.level === "door" ? "篩選門牌號，例：390" : `篩選${LEVEL_NAME[r.level]}，例：${r.level === "road" ? "中山" : "1"}`;
  renderCrumbs(); renderTiles();
}

function renderCrumbs() {
  const chosen = LEVELS.filter(isSet);
  document.getElementById("crumbs").innerHTML =
    (chosen.length ? `<button data-back="-1">全部</button>` : "")
    + chosen.map((k, i) => `<span class="cur">›</span><button data-back="${i}">${esc(k === "lane" ? laneLabel(pick[k]) : pick[k])}</button>`).join("")
    + `<span class="cur">${chosen.length ? "›" : ""} 選${LEVEL_NAME[pickLevel]}</span>`;
}

function renderTiles() {
  const f = filterEl.value.trim();
  const items = f ? pickItems.filter(x => (pickLevel === "lane" ? laneLabel(x.name) : x.name).includes(f)) : pickItems;
  tilesEl.className = "tiles" + (pickLevel === "door" ? " num" : pickLevel === "road" || pickLevel === "lane" ? " wide" : "");
  tilesEl.innerHTML = items.length ? items.map((x, i) => {
    const label = pickLevel === "lane" ? laneLabel(x.name) : x.name;
    const sub = pickLevel === "county" ? `${x.n} 區` : pickLevel === "door" ? "" : `${x.n.toLocaleString()} 門牌`;
    const has = pickLevel === "door" ? x.has : false;
    return `<button class="tile${has ? " has" : ""}" data-i="${pickItems.indexOf(x)}">${esc(label)}${sub ? `<small>${sub}</small>` : ""}</button>`;
  }).join("") : `<span class="hint">沒有符合的${LEVEL_NAME[pickLevel]}</span>`;
  document.getElementById("pickHint").innerHTML = pickLevel === "door"
    ? `<span style="color:var(--hi)">●</span> 這個門牌自己有實價登錄（最可能查到樓層）；沒有的也會用同棟、同巷推估`
    : pickLevel === "road" ? "依門牌數排序，常見的路在前面" : "";
}

tilesEl.addEventListener("click", e => {
  const b = e.target.closest(".tile"); if (!b) return;
  const x = pickItems[+b.dataset.i];
  if (pickLevel === "door") {
    const q = pick.county + pick.town + x.base;
    document.getElementById("q").value = q;
    tilesEl.querySelectorAll(".tile").forEach(t => t.style.outline = "");
    b.style.outline = "2px solid var(--accent)";
    doLookup(q);
    return;
  }
  pick[pickLevel] = x.name;
  loadPick();
});
document.getElementById("crumbs").addEventListener("click", e => {
  const b = e.target.closest("button[data-back]"); if (!b) return;
  const keep = +b.dataset.back;  // 保留到第 keep 層（含），之後清掉
  LEVELS.forEach((k, i) => { if (i > keep) pick[k] = k === "lane" ? null : ""; });
  loadPick();
});
filterEl.addEventListener("input", renderTiles);

const tabPick = document.getElementById("tabPick"), tabType = document.getElementById("tabType");
function setTab(t) {
  tabPick.classList.toggle("on", t === "pick"); tabType.classList.toggle("on", t === "type");
  document.getElementById("pickBox").hidden = t !== "pick";
  document.getElementById("typeBox").hidden = t !== "type";
  if (t === "type") document.getElementById("q").focus();
  try { localStorage.setItem("searchTab", t); } catch {}
}
tabPick.addEventListener("click", () => setTab("pick"));
tabType.addEventListener("click", () => setTab("type"));
let savedTab = "pick";
try { savedTab = localStorage.getItem("searchTab") || "pick"; } catch {}
setTab(savedTab);
loadPick();

// 方柱（沒有建物外框、用實價登錄樓層畫的門牌）點了直接查該門牌
map.on("click", "bldg", e => {
  const p = e.features[0].properties;
  if (p.pillar) { document.getElementById("q").value = p.addr; doLookup(p.addr); }
  else showBuilding(p.uid);
});
map.on("mouseenter", "bldg", () => map.getCanvas().style.cursor = "pointer");
map.on("mouseleave", "bldg", () => map.getCanvas().style.cursor = "");

// 整批
const drop = document.getElementById("drop"), fileIn = document.getElementById("file"), msg = document.getElementById("batchMsg");
async function upload(file) {
  msg.textContent = `處理中：${file.name}…`;
  const fd = new FormData(); fd.append("file", file);
  const r = await fetch("/api/batch", { method: "POST", body: fd });
  if (!r.ok) { msg.textContent = `失敗：${(await r.json().catch(() => ({}))).detail || r.status}`; return; }
  const blob = await r.blob();
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: file.name.replace(/\.[^.]+$/, "") + "_樓層.xlsx" });
  a.click();
  msg.textContent = `完成：已下載 ${a.download}`;
}
fileIn.addEventListener("change", () => fileIn.files[0] && upload(fileIn.files[0]));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); });

fetch("/api/stats").then(r => r.json()).then(rows => {
  const pct = x => `${(x * 100).toFixed(0)}%`;
  document.getElementById("stats").innerHTML =
    `<tr><td></td><td class="n hint">門牌號</td><td class="n hint">實價</td><td class="n hint">高＋中</td><td class="n hint">任一</td></tr>`
    + rows.map(s => `<tr><td>${esc(s.county)}</td><td class="n">${s.addresses.toLocaleString()}</td>`
      + `<td class="n">${pct(s.by_trade)}</td><td class="n">${pct(s.high_mid)}</td><td class="n">${pct(s.any_floor)}</td></tr>`).join("")
    + `<tr><td colspan="5" class="hint">實價＝該門牌自己有實價登錄；高＋中＝含同棟、同巷推估；任一＝再含低信心（建物圖、不一致的同棟）</td></tr>`;
});
</script>
