<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="/favicon.png?v=3" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>建物查詢平台</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; --soft: #f1f5f9;
    --accent: #2563eb; --accent-soft: #eff4ff; --hi: #15803d; --mid: #b45309; --lo: #b91c1c;
    /* 字級只用五種：32 大數字、20 頁面標題、16 區塊標題、14 內文、12 輔助說明與小標 */
    --fs-display: 32px; --fs-h1: 20px; --fs-title: 16px; --fs-body: 14px; --fs-cap: 12px;
    --radius: 10px; --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .06);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  small { font-size: var(--fs-cap); }  /* 不用瀏覽器預設的 smaller（約 11.7px），和其他輔助字對齊 */
  a { color: var(--accent); }
  #app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
  html, body { font-size: var(--fs-body); line-height: 1.6; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; }
  h1 { font-size: var(--fs-h1); line-height: 28px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; flex: none; }
  .sub { font-size: var(--fs-cap); color: var(--muted); margin-top: 6px; line-height: 1.6; }
  /* 小標（h2、風險資訊的 h4、展開標題）一律 12px 粗體灰字 */
  h2, .risk h4, details summary { font-size: var(--fs-cap); color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  h2 { margin: 0 0 10px; }
  form { display: flex; gap: 6px; }
  input[type=text], input[type=search] { font: inherit; color: var(--ink); background: var(--panel); }
  input[type=text] { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  /* 只套用到左側面板的按鈕；地圖上的縮放按鈕用 MapLibre 自己的樣式 */
  :where(aside) button { font: inherit; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  :where(aside) button:hover { filter: brightness(1.08); }
  :where(aside) button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .big { font-size: var(--fs-display); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .big small { font-size: var(--fs-body); font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  /* 欄位：名稱灰、值深色，同樣 14px；用顏色分主從，不用大小 */
  dl { display: grid; grid-template-columns: 104px 1fr; gap: 6px 12px; margin: 12px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: var(--fs-cap); padding: 2px 8px; border-radius: 99px; color: #fff; font-weight: 600; }
  .b-高 { background: var(--hi); } .b-中 { background: var(--mid); } .b-低, .b-無, .b-待確認 { background: var(--lo); }
  .note { font-size: var(--fs-cap); color: var(--muted); margin-top: 10px; overflow-wrap: anywhere; line-height: 1.6; }
  .risk { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
  .risk h3 { font-size: var(--fs-title); font-weight: 700; margin: 0; }
  .risk h4 { margin: 16px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--soft); }
  .risk dl { margin-top: 8px; }
  .ufl { font-size: var(--fs-cap); color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .rz { color: var(--lo); font-weight: 600; } .rn { color: var(--muted); } .rx { color: var(--muted); }
  .hzl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .hzl label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .hzl i { width: 14px; height: 14px; border-radius: 3px; background: var(--c); flex: none; }
  .addrs { font-size: var(--fs-cap); color: var(--muted); max-height: 120px; overflow-y: auto; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--soft); }
  .legend { display: flex; gap: 0; font-size: var(--fs-cap); color: var(--muted); }
  .legend span { flex: 1; text-align: center; padding-top: 14px; position: relative; }
  .legend span::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 10px; background: var(--c); }
  .legend span:first-child::before { border-radius: 4px 0 0 4px; } .legend span:last-child::before { border-radius: 0 4px 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-cap); margin-top: 8px; }
  details summary { cursor: pointer; }
  td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #drop { display: block; border: 1.5px dashed #cbd5e1; border-radius: var(--radius); padding: 16px; text-align: center; color: var(--ink); cursor: pointer; line-height: 1.6; background: var(--soft); }
  #drop:hover { border-color: var(--accent); }
  #drop .hint { display: block; margin-top: 6px; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  /* 分頁：整條切換鈕 */
  .tabs { display: flex; padding: 3px; margin-bottom: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius); }
  .tabs button { flex: 1; background: transparent; color: var(--muted); padding: 7px 0; border-radius: 7px; font-weight: 600; }
  .tabs button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: var(--fs-cap); margin-bottom: 8px; }
  .crumbs button { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; font-size: var(--fs-cap); }
  .crumbs .cur { color: var(--muted); }
  /* 高度上限讓 22 個縣市整個放得下；更多（路、門牌）時框內捲動，下緣淡出提示還有 */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; max-height: 380px; overflow-y: auto; padding: 2px; }
  .tiles.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); }
  .tiles.wide { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .tiles.num { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
  .tile { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 9px 4px; font-weight: 500; line-height: 1.3; position: relative; }
  .tile:hover { border-color: var(--accent); color: var(--accent); }
  .tile small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .tile.has::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--hi); }
  #f { position: relative; }
  /* 輸入框右側的清除鈕（有文字才出現） */
  .qwrap { position: relative; flex: 1; min-width: 0; display: flex; }
  .qwrap input { padding-right: 34px; }
  #qClear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; padding: 0;
    border-radius: 50%; background: transparent; color: var(--muted); font-size: 18px; font-weight: 400; line-height: 1; }
  #qClear:hover { background: var(--bg); color: var(--ink); }
  #sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.08); max-height: 320px; overflow-y: auto; }
  .sg { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); border-radius: 0; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .sg:last-child { border-bottom: 0; }
  :where(aside) .sg { font-weight: 400; }
  .sg:hover, .sg.on { background: var(--accent-soft); }
  .sg small { display: block; color: var(--muted); margin-top: 2px; }
  .sg .dot { color: var(--hi); }
  .didyou { margin-top: 10px; }
  .fb { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .fb summary { color: var(--accent); letter-spacing: 0; }
  .fbform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: var(--fs-cap); color: var(--muted); }
  .fbform label { display: flex; flex-direction: column; gap: 4px; }
  .fbform .wide { grid-column: 1 / -1; }
  .fbform input, .fbform select, .fbform textarea { font: inherit; font-size: var(--fs-body); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--panel); }
  .fbform textarea { resize: vertical; }
  .fbform button { justify-self: start; }
  .fbbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .card .again { margin-top: 12px; width: 100%; }
  .didyou .sg { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; }
  #pickFilter { width: 100%; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  #map { height: 100%; position: relative; }
  .hint { font-size: var(--fs-cap); color: var(--muted); line-height: 1.6; }
  .mob-only { display: none; }
  @media (max-width: 760px) {
    html, body { height: auto; }
    /* 手機：標題 → 地圖 → 查詢結果 → 選地址／輸入地址 → 其他 */
    #app { display: flex; flex-direction: column; height: auto; }
    aside, aside > section:first-of-type { display: contents; }
    aside > * { padding: 0 16px; }
    aside > div:first-child { order: 1; padding-top: 12px; padding-bottom: 10px; }
    #map { order: 2; height: 45vh; }
    #result { order: 3; padding: 0 16px; margin-top: 12px !important; }
    #result:empty { display: none; }
    .tabs { order: 4; margin: 16px 16px 12px; }
    #pickBox, #typeBox { order: 5; padding: 0 16px; }
    aside > section:not(:first-of-type) { order: 6; padding-top: 24px; }
    aside > section:last-of-type { padding-bottom: 24px; }
    .crumbs button { padding: 6px 12px; }
    .desk-only { display: none; }
    .mob-only { display: inline !important; }
    .card .again { display: block !important; }
    input[type=text], #pickFilter, .fbform input, .fbform select, .fbform textarea { font-size: 16px; }  /* iPhone：小於 16px 點輸入框會自動放大 */
    .tiles { max-height: 230px; overflow-y: auto; overscroll-behavior: contain; }  /* 超過就在框內捲動，不能溢出蓋到下面的區塊 */
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; overflow: visible; }
  }
</style>
<!-- Vercel Web Analytics：瀏覽數與訪客數（不用 cookie；本機開發時這支檔案不存在，無作用） -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="app">
  <aside>
    <div>
      <h1 class="brand"><img src="/logo.png" alt="" width="28" height="28">建物查詢平台</h1>
      <div class="sub">查門牌的樓層、構造、年份與災害潛勢<br>非官方工具，結果僅供參考 · <a href="/about">資料來源與授權</a></div>
    </div>

    <section>
      <div class="tabs"><button type="button" id="tabPick" class="on">選擇地址</button><button type="button" id="tabType">輸入地址</button></div>
      <div id="pickBox">
        <div class="crumbs" id="crumbs"></div>
        <input id="pickFilter" type="search" placeholder="篩選（可不填）" hidden>
        <div class="tiles" id="tiles"></div>
        <div class="hint" id="pickHint" style="margin-top:6px"></div>
      </div>
      <div id="typeBox" hidden>
        <form id="f" autocomplete="off"><span class="qwrap"><input id="q" type="text" placeholder="地址或地標，例：市政路390號"><button type="button" id="qClear" aria-label="清除" title="清除" hidden>×</button></span><button>查詢</button><div id="sugg" hidden></div></form>
        <div class="hint" style="margin-top:6px">可以打錯字、用簡寫或只打一部分，會列出最接近的門牌</div>
      </div>
      <div id="result" style="margin-top:12px"></div>
    </section>

    <section>
      <h2>整批查詢</h2>
      <label id="drop"><b class="desk-only">拖曳 Excel / CSV 到這裡</b><span class="desk-only">，或點擊選檔</span><b class="mob-only">點擊選擇 Excel / CSV 檔</b><span class="hint">自動找「地址」欄，回傳加上樓層欄位的 Excel<br>一次最多 2,000 筆、4 MB</span>
        <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
      <div id="batchMsg" class="note"></div>
    </section>

    <section>
      <h2>地上樓層</h2>
      <div class="legend" id="legend"></div>
      <div class="hint" style="margin-top:8px">放大到街區可看到 3D 建物，點建物看屬性</div>
    </section>

    <section>
      <h2>災害潛勢圖層</h2>
      <div class="hzl" id="hzl"></div>
      <div class="hint" id="hzhint" style="margin-top:8px">勾選後疊在地圖上；放大到鄉鎮範圍才會顯示。潛勢圖僅供防災參考。</div>
    </section>

    <section>
      <details class="fb fb-general"><summary>回報問題</summary>
        <form class="fbform">
          <label class="wide">問題類型<select name="kind"></select></label>
          <label class="wide">地點<input name="address" maxlength="100" placeholder="可不填，例：信義計畫區、某條路一帶"></label>
          <label class="wide">說明<textarea name="detail" maxlength="500" rows="3" required placeholder="例：這一區的建物都畫錯了、手機版某個按鈕沒反應"></textarea></label>
          <label class="wide">聯絡方式<input name="contact" maxlength="100" placeholder="可不填（需要確認時聯絡你）"></label>
          <button type="submit">送出</button><span class="fbmsg hint"></span>
          <div class="hint wide">樓層錯誤請先查詢該地址或點選建物，從結果卡片下方回報。</div>
        </form></details>
    </section>

    <section>
      <details><summary>各縣市涵蓋率</summary><table id="stats"></table></details>
    </section>
  </aside>
  <div id="map"></div>
</div>

<script type="module">
// MapLibre 6（ES module）：4.x 在 Safari 27 會不斷 WebGL context lost，6.12+ 修了 GPU 程序掛掉的處理
// 動態載入：CDN 失敗時只有地圖顯示說明，查詢照常
let maplibregl;
try { maplibregl = await import("https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs"); }
catch (e) { console.error("MapLibre 載入失敗", e); }

const RAMP = [[1, "#d9e6f2"], [3, "#a9c6e3"], [6, "#6f9fd0"], [13, "#3a6fb3"], [21, "#7a3fa0"], [31, "#c2185b"]];
const LABELS = ["1–2", "3–5", "6–12", "13–20", "21–30", "31+"];
document.getElementById("legend").innerHTML =
  RAMP.map((r, i) => `<span style="--c:${r[1]}">${LABELS[i]}</span>`).join("")
  + `<span style="--c:#bdbdbd">未知</span>`;

// 瀏覽器不支援 WebGL（硬體加速關閉、部分公司電腦／遠端桌面）時地圖畫不出來：
// 在地圖區顯示原因，並用不做事的替身物件，讓查詢等其他功能照常運作
function webglOK() {
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
  catch { return false; }
}
const MAP_OK = typeof maplibregl !== "undefined" && webglOK();
const NOOP = new Proxy(function () {}, { get: (t, k) => k === Symbol.toPrimitive ? () => "" : NOOP, apply: () => NOOP });
if (!MAP_OK) {
  document.getElementById("map").innerHTML = `<div style="padding:24px;max-width:460px;color:var(--muted);font-size:14px;line-height:1.7">
    <b style="color:var(--ink)">這個瀏覽器無法顯示 3D 地圖</b><br>
    地圖需要 WebGL。請確認瀏覽器設定裡的「硬體加速」已開啟，或改用最新版 Chrome、Edge、Safari。<br>
    查詢功能不受影響，可以照常使用。</div>`;
}
// ── 災害潛勢圖層（/api/hazards）：顏色依等級（rank）由淺到深 ──
const HAZARDS = [
  { kind: "flood500", name: "淹水（24h 500mm）", colors: ["#c6dbef", "#9ecae1", "#6baed6", "#3182bd", "#08519c"] },
  { kind: "liquefaction", name: "土壤液化", colors: ["#fee391", "#fe9929", "#cc4c02"] },
  { kind: "fault", name: "活動斷層", colors: ["#d7301f"] },
  { kind: "landslide", name: "山崩地滑", colors: ["#8c510a"] },
  { kind: "debris", name: "土石流", colors: ["#bcbddc", "#807dba", "#54278f"] },
  { kind: "fire_station", name: "消防分隊", colors: ["#e31a1c"], point: true },
];
const HZ_MIN_ZOOM = 12;
const rankColor = cs => cs.length === 1 ? cs[0] : ["match", ["get", "rank"], ...cs.flatMap((c, i) => [i, c]), cs[0]];
const HAZARD_LAYERS = HAZARDS.flatMap(h => h.point
  ? [{ id: `hz-${h.kind}`, type: "circle", source: `hz-${h.kind}`, layout: { visibility: "none" },
       paint: { "circle-radius": 6, "circle-color": h.colors[0], "circle-stroke-color": "#fff", "circle-stroke-width": 2 } }]
  : [{ id: `hz-${h.kind}`, type: "fill", source: `hz-${h.kind}`, layout: { visibility: "none" },
       paint: { "fill-color": rankColor(h.colors), "fill-opacity": 0.4 } },
     { id: `hz-${h.kind}-line`, type: "line", source: `hz-${h.kind}`, layout: { visibility: "none" },
       paint: { "line-color": rankColor(h.colors), "line-width": 1, "line-opacity": 0.7 } }]);

// 沒有樓層、只有 OSM 高度的建物：以 高度÷3.2m 上色
const BLDG_COLOR = ["case", ["all", ["==", ["get", "floors"], null], ["==", ["get", "h"], null]], "#bdbdbd",
  ["step", ["coalesce", ["get", "floors"], ["/", ["get", "h"], 3.2]], RAMP[0][1], ...RAMP.slice(1).flat()]];
const SEL_COLOR = "#ff8f00";
const map = !MAP_OK ? NOOP : new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      emap: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}"],
        attribution: "© 內政部國土測繪中心" },
      bldg: { type: "geojson", data: { type: "FeatureCollection", features: [] },
        attribution: "建物外框：<a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\">© OpenStreetMap 貢獻者</a>、臺中市政府、臺北市政府｜樓層與門牌：內政部實價登錄、各縣市政府門牌與使用執照資料（<a href=\"/about\">完整來源</a>）" },
      pin: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      ...Object.fromEntries(HAZARDS.map(h => [`hz-${h.kind}`, { type: "geojson", data: { type: "FeatureCollection", features: [] },
        attribution: "災害潛勢：經濟部水利署、地質調查及礦業管理中心、農業部、臺南市政府、內政部消防署" }])),
    },
    layers: [
      { id: "emap", type: "raster", source: "emap" },
      ...HAZARD_LAYERS,
      { id: "bldg", type: "fill-extrusion", source: "bldg", paint: {
          "fill-extrusion-color": BLDG_COLOR,
          "fill-extrusion-height": ["coalesce", ["get", "h"], 3.2],
          "fill-extrusion-base": ["coalesce", ["get", "base"], 0],
          "fill-extrusion-opacity": 0.85 } },

  center: [121.5654, 25.0355], zoom: 16, pitch: 50, bearing: -15,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl());
window.map = map;  // 方便在主控台除錯

// ── 地圖診斷：只有網址加 ?debug=1 時才在地圖上顯示狀態（一般使用者看不到） ──
const mapErrors = [];
let lostCount = 0;
map.on("error", e => {
  const msg = String(e?.error?.message || e?.error || e).slice(0, 160);
  mapErrors.push(msg);
  // WebGL 一直被瀏覽器收回（例：Safari 27.0）：顯示說明，不要只剩空白
  if (/context lost/i.test(msg) && ++lostCount === 20) showGLLost();
});
function showGLLost() {
  if (document.getElementById("gllost")) return;
  const box = document.createElement("div");
  box.id = "gllost";
  box.style.cssText = "position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)";
  box.innerHTML = `<div style="max-width:440px;color:var(--muted);font-size:14px;line-height:1.7">
    <b style="color:var(--ink)">瀏覽器的 3D 繪圖（WebGL）一直失效，地圖無法顯示</b><br>
    請更新到最新版瀏覽器（Safari：系統設定 → 一般 → 軟體更新），或改用 Chrome。<br>
    查詢功能不受影響，可以照常使用。</div>`;
  document.getElementById("map").appendChild(box);
}
if (MAP_OK) map.getCanvas().addEventListener("webglcontextlost", () => mapErrors.push("WebGL context lost"));
function showDiag(reason) {
  if (!MAP_OK || document.getElementById("diag")) return;
  const c = map.getCanvas();
  const box = document.createElement("div");
  box.id = "diag";
  box.style.cssText = "position:absolute;left:10px;bottom:30px;z-index:9;max-width:440px;background:rgba(255,255,255,.95);border:1px solid #ccc;border-radius:8px;padding:10px 12px;font:12px/1.5 monospace;color:#222;white-space:pre-wrap";
  box.textContent = [`地圖診斷（${reason}）`,
    `loaded=${map.loaded()} style=${map.isStyleLoaded()} 畫布=${c.width}x${c.height} 容器=${map.getContainer().offsetWidth}x${map.getContainer().offsetHeight} dpr=${devicePixelRatio}`,
    `中心=${map.getCenter().lng.toFixed(4)},${map.getCenter().lat.toFixed(4)} zoom=${map.getZoom().toFixed(1)}`,
    `錯誤(${mapErrors.length})：${mapErrors.slice(0, 5).join(" | ") || "無"}`,
    navigator.userAgent].join("\n");

if (new URLSearchParams(location.search).has("debug")) setTimeout(() => showDiag("debug"), 6000);

let timer;
async function loadBuildings() {
  if (!MAP_OK) return;
  if (map.getZoom() < 15.5) { map.getSource("bldg").setData({ type: "FeatureCollection", features: [] }); return; }
  const b = map.getBounds();
  const r = await fetch(`/api/buildings?bbox=${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`);
  map.getSource("bldg").setData(await r.json());
}
map.on("moveend", () => { clearTimeout(timer); timer = setTimeout(loadBuildings, 200); });

// 災害潛勢圖層：勾選的才載入；記住勾選狀態（只存在這台瀏覽器）
let hzOn = new Set();
try { hzOn = new Set(JSON.parse(localStorage.getItem("hazards") || "[]")); } catch {}
const hzEl = document.getElementById("hzl"), hzHint = document.getElementById("hzhint");
hzEl.innerHTML = HAZARDS.map(h => `<label><input type="checkbox" value="${h.kind}" ${hzOn.has(h.kind) ? "checked" : ""}>
  <i style="--c:${h.colors[h.colors.length - 1]}"></i>${h.name}</label>`).join("");
hzEl.addEventListener("change", e => {
  e.target.checked ? hzOn.add(e.target.value) : hzOn.delete(e.target.value);
  try { localStorage.setItem("hazards", JSON.stringify([...hzOn])); } catch {}
  loadHazards();
});
let hzTimer, hzSeq = 0;
async function loadHazards() {
  if (!MAP_OK || !map.isStyleLoaded()) return;
  const seq = ++hzSeq, z = map.getZoom(), b = map.getBounds();
  const bbox = `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
  let tooFar = false;
  for (const h of HAZARDS) {
    const on = hzOn.has(h.kind);
    for (const id of [`hz-${h.kind}`, `hz-${h.kind}-line`]) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
    if (!on) continue;
    if (z < HZ_MIN_ZOOM) { tooFar = true; map.getSource(`hz-${h.kind}`).setData({ type: "FeatureCollection", features: [] }); continue; }
    const r = await fetch(`/api/hazards?kind=${h.kind}&bbox=${bbox}`);
    if (seq !== hzSeq || !r.ok) return;  // 已經移到別處
    const data = await r.json();
    tooFar ||= !!data.too_large;
    map.getSource(`hz-${h.kind}`).setData(data);
  }
  hzHint.textContent = tooFar ? "目前地圖範圍太大，放大到鄉鎮範圍才會顯示圖層。"
    : "勾選後疊在地圖上；放大到鄉鎮範圍才會顯示。潛勢圖僅供防災參考。";
}
map.on("moveend", () => { clearTimeout(hzTimer); hzTimer = setTimeout(loadHazards, 250); });
map.on("load", loadHazards);
// 資料來源標示一開始就收成 ⓘ（點開才顯示），不擋地圖
map.on("load", () => document.querySelectorAll(".maplibregl-ctrl-attrib.maplibregl-compact-show")
  .forEach(e => e.classList.remove("maplibregl-compact-show")));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const v = x => x == null || x === "" ? "—" : esc(x);
// 標準化地址 → Google 地圖搜尋（官方網址格式，不需金鑰）；輸入沒寫縣市時補上查到的縣市區，避免找到別的城市
function gmapLink(r) {
  if (!r.normalized) return "—";
  const full = r.county && !r.normalized.startsWith(r.county) ? `${r.county}${r.town || ""}${r.normalized}` : r.normalized;
  const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(full)}`;
  const link = `<a href="${esc(url)}" target="_blank" rel="noopener" title="在 Google 地圖開啟">${esc(full)} ↗</a>`;
  // 有門牌座標時加街景：Google 會開在離這個點最近的街景
  const pano = r.lat != null && r.lon != null
    ? ` · <a href="${esc(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${r.lat},${r.lon}`)}" target="_blank" rel="noopener">街景 ↗</a>`
    : "";
  return link + pano;
}

// 飛到查到的建物：畫面中心放在建物上，鏡頭站在門牌那一側（臨街面）朝建物看，
// 避免同一基地的其他高樓擋在鏡頭和這棟之間
function viewOf(door, bldg) {
  const view = { center: [door.lon, door.lat], zoom: 18, pitch: 55 };
  if (!bldg || bldg.lon == null) return view;
  const k = Math.cos(door.lat * Math.PI / 180);
  const dx = (bldg.lon - door.lon) * k, dy = bldg.lat - door.lat;
  view.center = [bldg.lon, bldg.lat];
  if (Math.hypot(dx, dy) > 3e-5) view.bearing = Math.atan2(dx, dy) * 180 / Math.PI;  // 門牌離建物中心 3 m 以上才轉向
  return view;
}

// 選取的建物：整棟立體改成橘色（高樓在斜視角會擋住地面的外框線），地面外框線保留
function select(uid) {
  map.setFilter("bldg-sel", ["==", ["get", "uid"], uid || ""]);
  map.setPaintProperty("bldg", "fill-extrusion-color",
    uid ? ["case", ["==", ["get", "uid"], uid], SEL_COLOR, BLDG_COLOR] : BLDG_COLOR);
}

// 點地圖上的建物：只看建物圖屬性
// 點地圖建物的卡片抬頭：名稱、地址（Google 地圖＋街景）；沒有門牌的用建物位置開地圖
function bldgHead(b) {
  const first = (b.addresses || [])[0];
  const more = (b.addresses || []).length > 1 ? `<small class="rx">（共 ${b.addresses.length} 個門牌，見下方）</small>` : "";
  let place = "—";
  if (first) place = gmapLink({ normalized: `${b.county || ""}${first}`, lat: b.lat, lon: b.lon }) + more;
  else if (b.lat != null) {
    const at = `${b.lat},${b.lon}`;
    place = `<a href="${esc(`https://www.google.com/maps/search/?api=1&query=${at}`)}" target="_blank" rel="noopener">Google 地圖 ↗</a>`
      + ` · <a href="${esc(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${at}`)}" target="_blank" rel="noopener">街景 ↗</a>`
      + ` <small class="rx">（沒有門牌，依建物位置）</small>`;
  }
  return `<dl style="margin-top:10px">${b.name ? `<dt>名稱</dt><dd>${esc(b.name)}</dd>` : ""}<dt>地址</dt><dd>${place}</dd></dl>`;
}

async function showBuilding(uid) {
  const b = await (await fetch(`/api/building/${encodeURIComponent(uid)}`)).json();
  select(uid);
  document.getElementById("result").innerHTML = card(b, bldgHead(b), b);
  // 在地圖上點的建物也能回報：附上建物編號（OSM 建物審核後整棟套用，地標常沒有門牌）
  const first = (b.addresses || [])[0];
  const addr = first ? `${b.county || ""}${first}` : (b.name || `地圖建物 ${uid}`);
  const cardEl = document.getElementById("result").querySelector(".card");
  cardEl.insertAdjacentHTML("beforeend", riskHtml(b));
  cardEl.insertAdjacentHTML("beforeend", feedbackHtml({ normalized: addr, floors_above: b.floors_above }, uid));
  cardEl.insertAdjacentHTML("beforeend", `<button type="button" class="again mob-only">查詢其他地址</button>`);
}

// 查詢結果（圖資＋實價合併後）為主；有對到建物就附上同棟門牌
function card(r, head, bldg) {
  return `
    <div class="card">
      <div class="big">${v(r.floors_above)}<small>層（地上）</small></div>
      ${head}
      <dl>
        <dt>地下樓層</dt><dd>${v(r.floors_below)}</dd>
        <dt>構造</dt><dd>${v(r.structure)}</dd>
        <dt>建物型態</dt><dd>${v(r.btype)}</dd>
        <dt>${v(r.year_kind || "年份")}</dt><dd>${v(r.year)}</dd>
        <dt>資料來源</dt><dd>${v(r.source)}</dd>
        ${r.t_n != null ? `<dt>實價筆數</dt><dd>${v(r.t_n)}</dd>` : ""}
        ${bldg ? `<dt>同棟門牌</dt><dd>${v(bldg.n_units)}</dd>` : ""}
      </dl>
      ${bldg && bldg.note ? `<div class="note">${bldg.osm ? "OSM 建物：" : ""}${esc(bldg.note)}</div>` : ""}
      ${bldg && String(bldg.source || "").includes("建照套繪") ? `<div class="note">臺北市建照套繪圖是一張建照一個外框，只記最高樓層；同一張建照裡較低的部分（裙樓、附屬建物等）也會被畫成同樣高度。</div>` : ""}
      ${bldg ? `<div class="addrs">${bldg.addresses.map(esc).join("<br>")}</div>` : ""}
    </div>`;
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  lastSubmitted = q; clearTimeout(suggTimer); suggSeq++;  // 取消還在路上的建議請求
  hideSugg();
  if (q) doLookup(q);
});

async function doLookup(q) {
  const resp = await fetch(`/api/lookup?q=${encodeURIComponent(q)}`);
  if (!resp.ok) {  // 例：查詢太頻繁（429）
    const err = await resp.json().catch(() => ({}));
    document.getElementById("result").innerHTML = `<div class="note">${esc(err.detail || `查詢失敗（${resp.status}）`)}</div>`;
    return;
  }
  const r = await resp.json();
  const head = `<dl style="margin-top:10px">
      <dt>標準化</dt><dd>${gmapLink(r)}</dd>
      <dt>所在樓層</dt><dd>${v(r.unit_floor)}</dd>
      <dt>比對方式</dt><dd>${v(r.level)}</dd>
      <dt>信心</dt><dd><span class="badge b-${esc(r.confidence)}">${esc(r.confidence)}</span></dd>
    </dl>${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}`;
  // 基隆、南投、嘉義市、宜蘭、連江沒有門牌座標：只有實價登錄，地圖無法定位
  const noCoord = r.lon == null && r.county && r.confidence !== "無" && r.confidence !== "待確認"
    ? `<div class="note">${esc(r.county)}沒有開放門牌座標資料，地圖無法定位到這個門牌（樓層資料來自實價登錄）。</div>` : "";
  // 有 OSM 建物（每棟分開）優先框它，其次市府建物圖
  const uid = r.osm_uid || r.bldg_uid;
  const bldg = uid ? await (await fetch(`/api/building/${encodeURIComponent(uid)}`)).json() : null;
  if (r.lon != null) {
    map.getSource("pin").setData({ type: "Point", coordinates: [r.lon, r.lat] });
    map.flyTo(viewOf(r, bldg));
  }
  select(uid);
  document.getElementById("result").innerHTML = card(r, head + noCoord, bldg);
  const cardEl = document.getElementById("result").querySelector(".card");
  if (r.normalized && r.confidence !== "待確認") cardEl.insertAdjacentHTML("beforeend", riskHtml(r));
  if (r.normalized && r.confidence !== "待確認") cardEl.insertAdjacentHTML("beforeend", feedbackHtml(r));
  // 手機：結果在地圖下方、選單更下面，給一顆回到選單的按鈕
  cardEl.insertAdjacentHTML("beforeend", `<button type="button" class="again mob-only">查詢其他地址</button>`);
  // 手機：結果卡片排在地圖正下方，查詢完捲到地圖，地圖與結果一起看
  if (matchMedia("(max-width: 760px)").matches) document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "start" });
  // 查不到時：列出模糊搜尋的候選
  if (r.confidence === "無" || r.confidence === "待確認") {
    const items = (await (await fetch(`/api/suggest?q=${encodeURIComponent(q)}`)).json())
      .filter(x => x.kind !== "road" && x.text !== r.normalized);
    if (items.length) document.getElementById("result").insertAdjacentHTML("beforeend",
      `<div class="didyou"><h2>你是不是要找</h2>${items.map(sgHtml).join("")}</div>`);
  }
}

// ── 打字時的模糊搜尋建議（/api/suggest） ──
const qEl = document.getElementById("q"), suggEl = document.getElementById("sugg");
let suggItems = [], suggOn = -1, suggTimer, suggSeq = 0;
function sgHtml(x, i) {
  const dot = x.has ? `<span class="dot">●</span> ` : "";
  return `<button type="button" class="sg" data-text="${esc(x.text)}" data-kind="${esc(x.kind)}">${dot}${esc(x.text)}`
    + `${x.hint ? `<small>${esc(x.hint)}</small>` : ""}</button>`;
}
function hideSugg() { suggEl.hidden = true; suggOn = -1; }
let lastSubmitted = "";
async function updateSugg() {
  const q = qEl.value.trim();
  if (q.length < 2 || q === lastSubmitted) { hideSugg(); return; }  // 已送出查詢的文字不再跳建議
  const seq = ++suggSeq;
  const resp = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`);
  if (!resp.ok) { hideSugg(); return; }
  const items = await resp.json();
  if (seq !== suggSeq) return;  // 有更新的輸入，丟掉舊結果
  suggItems = items; suggOn = -1;
  suggEl.innerHTML = items.map(sgHtml).join("");
  suggEl.hidden = !items.length;
}
function chooseSugg(text, kind) {
  qEl.value = text; syncClear();
  hideSugg();
  if (kind === "road") { qEl.focus(); updateSugg(); return; }  // 選了路，接著打門牌號
  doLookup(text);
}
const qClear = document.getElementById("qClear");
const syncClear = () => { qClear.hidden = !qEl.value; };
qEl.addEventListener("input", () => { syncClear(); clearTimeout(suggTimer); suggTimer = setTimeout(updateSugg, 200); });
// 一鍵清除：清掉文字與建議，游標留在輸入框可以直接打下一筆（查詢結果和地圖不動）
qClear.addEventListener("click", () => {
  clearTimeout(suggTimer); suggSeq++;
  qEl.value = ""; lastSubmitted = ""; hideSugg(); syncClear(); qEl.focus();
});
qEl.addEventListener("keydown", e => {
  if (suggEl.hidden || !suggItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    suggOn = (suggOn + (e.key === "ArrowDown" ? 1 : -1) + suggItems.length) % suggItems.length;
    suggEl.querySelectorAll(".sg").forEach((b, i) => b.classList.toggle("on", i === suggOn));
  } else if (e.key === "Enter" && suggOn >= 0) {
    e.preventDefault();
    chooseSugg(suggItems[suggOn].text, suggItems[suggOn].kind);
  } else if (e.key === "Escape") hideSugg();
});
qEl.addEventListener("blur", () => setTimeout(hideSugg, 150));
document.getElementById("result").addEventListener("click", e => {
  const b = e.target.closest(".sg"); if (b) chooseSugg(b.dataset.text, b.dataset.kind);
});
suggEl.addEventListener("mousedown", e => {
  const b = e.target.closest(".sg"); if (b) { e.preventDefault(); chooseSugg(b.dataset.text, b.dataset.kind); }
});

// ── 建物風險資訊：C 建築結構、O 使用性質、E 災害潛勢（sitefloor/risk.py） ──
const NOT_IN_ZONE = "未在範圍內", NO_MAP = "此區無圖資";
function hz(x) {
  if (x == null) return `<span class="rx">—（沒有門牌座標）</span>`;
  if (x === NOT_IN_ZONE) return `<span class="rn">${x}</span>`;
  if (x === NO_MAP) return `<span class="rx">${x}</span>`;
  return `<span class="rz">${esc(x)}</span>`;
}
const dist = m => m >= 1000 ? `${(m / 1000).toFixed(1)} 公里` : `${m} 公尺`;
function hydrant(r) {
  if (r.lon == null) return hz(null);
  if (r.hydrants_100m == null) return hz(NO_MAP);  // 金門、連江沒有消防栓資料
  return r.hydrant_m != null ? `直線 ${dist(r.hydrant_m)}` : "2 公里內沒有";
}
function riskHtml(r) {
  const age = r.year ? `${new Date().getFullYear() - r.year} 年（${esc(r.year_kind || "年份")} ${esc(r.year)}）` : "—";
  const flood = d => d && d !== NOT_IN_ZONE && d !== NO_MAP ? `${d} 公尺` : d;
  return `<div class="risk"><h3>建物風險資訊</h3>
    ${r.risk_note ? `<div class="note">${esc(r.risk_note)}</div>` : ""}
    <h4>建築結構</h4><dl>
      <dt>構造</dt><dd>${v(r.structure)}</dd>
      <dt>樓層</dt><dd>${r.floors_above != null ? `地上 ${esc(r.floors_above)} 層` : "—"}${r.floors_below != null ? `、地下 ${esc(r.floors_below)} 層` : ""}</dd>
      <dt>屋齡</dt><dd>${age}${r.year_kind === "建照年" ? `<br><small class="rx">臺北市建照套繪圖只收民國 90 年後的建照；舊建物改建、增建也會領新建照，不一定是興建年</small>` : ""}</dd></dl>
    <h4>使用性質</h4><dl>
      <dt>主要用途</dt><dd>${v(r.usage)}${r.usage_source ? ` <small class="rx">（${esc(r.usage_source)}）</small>` : ""}${r.usage_floors ? `<div class="ufl">${r.usage_floors.split("；").map(x => `<div>${esc(x)}</div>`).join("")}</div>` : ""}</dd>
      <dt>使用分區</dt><dd>${v(r.zoning)}</dd>
      <dt>建物型態</dt><dd>${v(r.btype)}</dd></dl>
    <h4>安全防護</h4><dl>
      <dt>最近消防分隊</dt><dd>${r.fire_station ? `${esc(r.fire_station.replace(/^.*?消防局/, ""))}（直線 ${dist(r.fire_station_m)}）` : hz(r.lon == null ? null : NO_MAP)}</dd>
      <dt>最近消防栓</dt><dd>${hydrant(r)}</dd>
      <dt>100m 內消防栓</dt><dd>${r.hydrants_100m != null ? `${esc(r.hydrants_100m)} 支` : hz(r.lon == null ? null : NO_MAP)}</dd></dl>
    <h4>災害潛勢</h4><dl>
      <dt>淹水 500mm</dt><dd>${hz(flood(r.flood500))}</dd>
      <dt>淹水 650mm</dt><dd>${hz(flood(r.flood650))}</dd>
      <dt>土壤液化</dt><dd>${hz(r.liquefaction)}</dd>
      <dt>活動斷層</dt><dd>${hz(r.fault)}</dd>
      <dt>山崩地滑</dt><dd>${hz(r.landslide)}</dd>
      <dt>土石流</dt><dd>${hz(r.debris)}</dd></dl>
    <div class="note">消防分隊、消防栓為直線距離，不是道路距離。淹水為 24 小時累積雨量 500／650mm 情境的模擬淹水深度；活動斷層、山崩地滑為地質敏感區；土石流為潛勢溪流影響範圍。潛勢圖僅供防災參考，不代表實際會發生，也不適用於土地使用管制（水利署、地調所、農業部資料，<a href="/about">來源</a>）。土壤液化為地調所全國圖資（澎湖、金門、連江沒有）。</div>
  </div>`;
}

// ── 問題回報：結果卡片下方的表單，送到 /api/feedback（推播給維護者審核） ──
// 類型要和 sitefloor/feedback.py 的 KINDS 一致
const FB_KINDS = [["floors", "樓層錯誤"], ["address", "地址或位置錯誤"], ["shape", "建物形狀或立體圖錯誤"],
  ["info", "年份、構造或用途錯誤"], ["hazard", "災害潛勢或消防資訊錯誤"], ["site", "網站功能或建議"], ["other", "其他問題"]];
// 側欄的一般回報：不限地址，樓層錯誤要從結果卡片回報
document.querySelector(".fb-general select").innerHTML = FB_KINDS.filter(([k]) => k !== "floors")
  .map(([k, t]) => `<option value="${k}">${t}</option>`).join("");
function feedbackHtml(r, building = "") {
  const addr = r.county && !r.normalized.startsWith(r.county) ? `${r.county}${r.town || ""}${r.normalized}` : r.normalized;
  return `<details class="fb"><summary>資料有誤？回報問題</summary>
    <form class="fbform" data-addr="${esc(addr)}" data-shown="${esc(r.floors_above ?? "")}" data-bldg="${esc(building)}">
      <label class="wide">問題類型<select name="kind">${FB_KINDS.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
      <label class="fl">地上樓層<input name="floors_above" type="number" min="1" max="110"></label>
      <label class="fl">地下樓層<input name="floors_below" type="number" min="0" max="20" placeholder="可不填"></label>
      <label class="wide fd" hidden>說明<textarea name="detail" maxlength="500" rows="3" placeholder="例：這裡應該只有一棟、地址對到隔壁、年份不對"></textarea></label>
      <label class="wide">依據<input name="basis" maxlength="200" placeholder="例：住在這裡、使用執照、建案資料"></label>
      <label class="wide">聯絡方式<input name="contact" maxlength="100" placeholder="可不填（需要確認時聯絡你）"></label>
      <div class="wide fbbtns"><button type="submit">送出</button><span class="fbmsg hint"></span></div>
      <div class="hint wide">不知道正確資料也可以：什麼都不填直接送出，就是「標記這筆有誤」。</div>
    </form></details>`;
}
document.getElementById("result").addEventListener("click", e => {
  if (e.target.closest(".again")) document.querySelector(".tabs").scrollIntoView({ behavior: "smooth", block: "start" });
});
// 樓層錯誤才要填樓層；其他問題改填說明
document.addEventListener("change", e => {
  if (e.target.name !== "kind") return;
  const f = e.target.closest(".fbform"), floors = e.target.value === "floors";
  if (!f.querySelector(".fl")) return;  // 側欄的一般回報沒有樓層欄位
  f.querySelectorAll(".fl").forEach(l => l.hidden = !floors);
  f.querySelector(".fd").hidden = floors;
});
async function sendFeedback(f, data) {
  const msg = f.querySelector(".fbmsg"), btns = f.querySelectorAll("button");
  btns.forEach(b => b.disabled = true); msg.textContent = "送出中…";
  if (f.dataset.addr !== undefined) Object.assign(data, { address: f.dataset.addr, shown: f.dataset.shown, building: f.dataset.bldg });
  const resp = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const out = await resp.json().catch(() => ({}));
  if (resp.ok) { msg.textContent = "已收到，謝謝！確認後會更新。"; f.querySelectorAll("input, select, textarea").forEach(i => i.disabled = true); }
  else { msg.textContent = out.detail || `送出失敗（${resp.status}）`; btns.forEach(b => b.disabled = false); }
}
// 結果卡片的回報：有填資料就是一般回報；樓層、說明、依據都沒填就送出＝只標記這筆有誤
document.addEventListener("submit", e => {
  const f = e.target.closest(".fbform"); if (!f) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f));
  const filled = ["floors_above", "floors_below", "detail", "basis"].some(k => String(data[k] || "").trim());
  if (f.dataset.addr !== undefined && !filled) data.quick = true;
  sendFeedback(f, data);
});

// ── 用選的：縣市 → 鄉鎮市區 → 路街 → 巷弄 → 門牌號（/api/pick 回傳下一層） ──
const LEVELS = ["county", "town", "road", "lane"];
const LEVEL_NAME = { county: "縣市", town: "鄉鎮市區", road: "路／街", lane: "巷弄", door: "門牌號" };
const pick = { county: "", town: "", road: "", lane: null };
const tilesEl = document.getElementById("tiles"), filterEl = document.getElementById("pickFilter");
let pickItems = [], pickLevel = "county";
const laneLabel = l => l === "" ? "沿路門牌" : l;
const isSet = k => k === "lane" ? pick.lane != null : pick[k] !== "";

async function loadPick() {
  const p = new URLSearchParams();
  for (const k of LEVELS) if (isSet(k)) p.set(k, pick[k]);
  tilesEl.innerHTML = `<span class="hint">載入中…</span>`;
  const r = await (await fetch(`/api/pick?${p}`)).json();
  pickLevel = r.level; pickItems = r.items;
  if (r.level === "door") pick.lane = r.lane;  // 只有一種巷弄時後端直接給門牌
  filterEl.value = "";
  filterEl.hidden = pickItems.length <= 40;
  filterEl.placeholder = r.level === "door" ? "篩選門牌號，例：390" : `篩選${LEVEL_NAME[r.level]}，例：${r.level === "road" ? "中山" : "1"}`;
  renderCrumbs(); renderTiles();
}

function renderCrumbs() {
  const chosen = LEVELS.filter(isSet);
  document.getElementById("crumbs").innerHTML =
    (chosen.length ? `<button data-back="-1">全部</button>` : "")
    + chosen.map((k, i) => `<span class="cur">›</span><button data-back="${i}">${esc(k === "lane" ? laneLabel(pick[k]) : pick[k])}</button>`).join("")
    + `<span class="cur">${chosen.length ? "›" : ""} 選${LEVEL_NAME[pickLevel]}</span>`;
}

// 框內還有沒捲到的項目：下緣淡出（Mac 預設不顯示捲軸，否則看起來像框線被切掉）
function tileFade() {
  tilesEl.classList.toggle("more", tilesEl.scrollHeight - tilesEl.scrollTop - tilesEl.clientHeight > 4);
}
tilesEl.addEventListener("scroll", tileFade, { passive: true });
window.addEventListener("resize", tileFade);

function renderTiles() {
  const f = filterEl.value.trim();
  const items = f ? pickItems.filter(x => (pickLevel === "lane" ? laneLabel(x.name) : x.name).includes(f)) : pickItems;
  tilesEl.className = "tiles" + (pickLevel === "door" ? " num" : pickLevel === "road" || pickLevel === "lane" ? " wide" : "");
  tilesEl.innerHTML = items.length ? items.map((x, i) => {
    const label = pickLevel === "lane" ? laneLabel(x.name) : x.name;
    const sub = pickLevel === "county" ? `${x.n} 區` : pickLevel === "door" ? "" : `${x.n.toLocaleString()} 門牌`;
    const has = pickLevel === "door" ? x.has : false;
    return `<button class="tile${has ? " has" : ""}" data-i="${pickItems.indexOf(x)}">${esc(label)}${sub ? `<small>${sub}</small>` : ""}</button>`;
  }).join("") : `<span class="hint">沒有符合的${LEVEL_NAME[pickLevel]}</span>`;
  tilesEl.scrollTop = 0;
  tileFade();
  document.getElementById("pickHint").innerHTML = pickLevel === "door"
    ? `<span style="color:var(--hi)">●</span> 這個門牌自己有實價登錄（最可能查到樓層）；沒有的也會用同棟、同巷推估`
    : pickLevel === "road" ? "依門牌數排序，常見的路在前面" : "";
}

tilesEl.addEventListener("click", e => {
  const b = e.target.closest(".tile"); if (!b) return;
  const x = pickItems[+b.dataset.i];
  if (pickLevel === "door") {
    const q = pick.county + pick.town + x.base;
    document.getElementById("q").value = q; syncClear();
    tilesEl.querySelectorAll(".tile").forEach(t => t.style.outline = "");
    b.style.outline = "2px solid var(--accent)";
    doLookup(q);
    return;
  }
  pick[pickLevel] = x.name;
  loadPick();
});
document.getElementById("crumbs").addEventListener("click", e => {
  const b = e.target.closest("button[data-back]"); if (!b) return;
  const keep = +b.dataset.back;  // 保留到第 keep 層（含），之後清掉
  LEVELS.forEach((k, i) => { if (i > keep) pick[k] = k === "lane" ? null : ""; });
  loadPick();
});
filterEl.addEventListener("input", renderTiles);

const tabPick = document.getElementById("tabPick"), tabType = document.getElementById("tabType");
function setTab(t) {
  tabPick.classList.toggle("on", t === "pick"); tabType.classList.toggle("on", t === "type");
  document.getElementById("pickBox").hidden = t !== "pick";
  document.getElementById("typeBox").hidden = t !== "type";
  if (t === "type") document.getElementById("q").focus();
  try { localStorage.setItem("searchTab", t); } catch {}
}
tabPick.addEventListener("click", () => setTab("pick"));
tabType.addEventListener("click", () => setTab("type"));
let savedTab = "pick";
try { savedTab = localStorage.getItem("searchTab") || "pick"; } catch {}
setTab(savedTab);
loadPick();

// 方柱（沒有建物外框、用實價登錄樓層畫的門牌）點了直接查該門牌
map.on("click", "bldg", e => {
  const p = e.features[0].properties;
  if (p.pillar) { document.getElementById("q").value = p.addr; syncClear(); doLookup(p.addr); }
  else showBuilding(p.uid);
});
map.on("mouseenter", "bldg", () => map.getCanvas().style.cursor = "pointer");
map.on("mouseleave", "bldg", () => map.getCanvas().style.cursor = "");

// 整批
const drop = document.getElementById("drop"), fileIn = document.getElementById("file"), msg = document.getElementById("batchMsg");
async function upload(file) {
  msg.textContent = `處理中：${file.name}…`;
  const fd = new FormData(); fd.append("file", file);
  const r = await fetch("/api/batch", { method: "POST", body: fd });
  if (!r.ok) { msg.textContent = `失敗：${(await r.json().catch(() => ({}))).detail || r.status}`; return; }
  const blob = await r.blob();
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: file.name.replace(/\.[^.]+$/, "") + "_樓層.xlsx" });
  a.click();
  msg.textContent = `完成：已下載 ${a.download}`;
}
fileIn.addEventListener("change", () => fileIn.files[0] && upload(fileIn.files[0]));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); });

fetch("/api/stats").then(r => r.json()).then(rows => {
  const pct = x => `${(x * 100).toFixed(0)}%`;
  document.getElementById("stats").innerHTML =
    `<tr><td></td><td class="n hint">門牌號</td><td class="n hint">實價</td><td class="n hint">高＋中</td><td class="n hint">任一</td></tr>`
    + rows.map(s => `<tr><td>${esc(s.county)}</td><td class="n">${s.addresses.toLocaleString()}</td>`
      + `<td class="n">${pct(s.by_trade)}</td><td class="n">${pct(s.high_mid)}</td><td class="n">${pct(s.any_floor)}</td></tr>`).join("")
    + `<tr><td colspan="5" class="hint">實價＝該門牌自己有實價登錄；高＋中＝含同棟、同巷、附近一致的推估；任一＝再含低信心（建物圖、不一致的同棟、附近七成以上一致、同路一致）</td></tr>`;
});
</script>
</body>
</html>
