[project]
name = "site-investigation"
version = "0.1.0"
requires-python = ">=3.12"
# 網站執行需要的套件（Vercel 只裝這些）
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "shapely>=2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# 建庫用（讀 shapefile、OSM pbf、匯出 parquet 等）；部署不需要
build = [
    "certifi>=2024.0",
    "geopandas>=1.2.0",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pypdf>=6.21.4",
]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
default-groups = ["dev", "build"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.server:app"
