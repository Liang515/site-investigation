[project]
name = "site-investigation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "geopandas>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
